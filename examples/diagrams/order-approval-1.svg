<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 376 764" width="376" height="764" role="img" aria-label="Purchase order approval">
<title>Purchase order approval</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-terminal:#2c7d4f;--mv-kf-terminal:#e4eee8;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-k-decision:#b87a00;--mv-kf-decision:#f6eede;--mv-k-rework:#a8327a;--mv-kf-rework:#f4e4ee;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-terminal:#009e73;--mv-kf-terminal:#0b3939;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-k-decision:#e69f00;--mv-kf-decision:#29392a;--mv-k-rework:#cc79a7;--mv-kf-rework:#26343f;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="terminal"] .mv-shape{fill:var(--mv-kf-terminal);stroke:var(--mv-k-terminal)}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
[data-kind="decision"] .mv-shape{fill:var(--mv-kf-decision);stroke:var(--mv-k-decision)}
[data-kind="rework"] .mv-shape{fill:var(--mv-kf-rework);stroke:var(--mv-k-rework)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-point{fill:var(--mv-edge);stroke:var(--mv-edge)}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="terminal"] .mv-stripe{fill:var(--mv-k-terminal)}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-kind="decision"] .mv-stripe{fill:var(--mv-k-decision)}
[data-kind="rework"] .mv-stripe{fill:var(--mv-k-rework)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="376" height="764" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge mv-main" data-edge="A-B" data-style="solid"><path class="mv-line" d="M92,88L92,129"/><polygon class="mv-head" points="92,136 96.5,127 87.5,127"/></g><g class="mv-edge mv-main" data-edge="B-C" data-style="solid"><path class="mv-line" d="M92,196L92,237"/><polygon class="mv-head" points="92,244 96.5,235 87.5,235"/></g><g class="mv-edge mv-main" data-edge="C-D" data-style="solid"><path class="mv-line" d="M92,304L92,345"/><polygon class="mv-head" points="92,352 96.5,343 87.5,343"/><text class="mv-label" style="text-anchor:start"><tspan class="mv-label-line" x="99" y="329">Yes</tspan></text></g><g class="mv-edge" data-edge="C-E" data-style="solid"><path class="mv-line" d="M156,274L276,274Q284,274 284,282L284,561"/><polygon class="mv-head" points="284,568 288.5,559 279.5,559"/><text class="mv-label"><tspan class="mv-label-line" x="179.5" y="264">No</tspan></text></g><g class="mv-edge" data-edge="E-B" data-style="solid"><path class="mv-line" d="M304,568L304,174Q304,166 296,166L163,166"/><polygon class="mv-head" points="156,166 165,170.5 165,161.5"/></g><g class="mv-edge mv-main" data-edge="D-F" data-style="solid"><path class="mv-line" d="M92,412L92,453"/><polygon class="mv-head" points="92,460 96.5,451 87.5,451"/></g><g class="mv-edge mv-main" data-edge="F-G" data-style="solid"><path class="mv-line" d="M92,520L92,561"/><polygon class="mv-head" points="92,568 96.5,559 87.5,559"/><text class="mv-label" style="text-anchor:start"><tspan class="mv-label-line" x="99" y="545">Yes</tspan></text></g><g class="mv-edge" data-edge="F-E" data-style="solid"><path class="mv-line" d="M156,490L256,490Q264,490 264,498L264,561"/><polygon class="mv-head" points="264,568 268.5,559 259.5,559"/><text class="mv-label"><tspan class="mv-label-line" x="179.5" y="480">No</tspan></text></g><g class="mv-edge mv-main" data-edge="G-H" data-style="solid"><path class="mv-line" d="M92,628L92,669"/><polygon class="mv-head" points="92,676 96.5,667 87.5,667"/></g></g><g></g><g><g class="mv-node" data-node="A" data-kind="terminal"><rect class="mv-shape mv-pill" x="28" y="28" width="128" height="60" rx="30"/><text><tspan x="92" y="62.5">Submit order</tspan></text></g><g class="mv-node" data-node="B" data-kind="step"><rect class="mv-shape" x="28" y="136" width="128" height="60" rx="8"/><text><tspan x="92" y="170.5">Validate order</tspan></text></g><g class="mv-node" data-node="C" data-kind="decision"><polygon class="mv-shape" points="92,244 156,274 92,304 28,274"/><text><tspan x="92" y="270.5">Within</tspan><tspan x="92" y="286.5">budget?</tspan></text></g><g class="mv-node" data-node="D" data-kind="step"><rect class="mv-shape" x="28" y="352" width="128" height="60" rx="8"/><text><tspan x="92" y="378.5">Manager</tspan><tspan x="92" y="394.5">approval</tspan></text></g><g class="mv-node" data-node="E" data-kind="rework"><rect class="mv-shape" x="220" y="568" width="128" height="60" rx="8"/><rect class="mv-stripe" x="221" y="576" width="4" height="44"/><text><tspan x="284" y="602.5">Revise order</tspan></text></g><g class="mv-node" data-node="F" data-kind="decision"><polygon class="mv-shape" points="92,460 156,490 92,520 28,490"/><text><tspan x="92" y="494.5">Approved?</tspan></text></g><g class="mv-node" data-node="G" data-kind="step"><rect class="mv-shape" x="28" y="568" width="128" height="60" rx="8"/><text><tspan x="92" y="594.5">Send to</tspan><tspan x="92" y="610.5">supplier</tspan></text></g><g class="mv-node" data-node="H" data-kind="terminal"><rect class="mv-shape mv-pill" x="28" y="676" width="128" height="60" rx="30"/><text><tspan x="92" y="710.5">Order placed</tspan></text></g></g>
</svg>
