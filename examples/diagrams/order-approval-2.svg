<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 425 656" width="425" height="656" role="img" aria-label="Supplier onboarding">
<title>Supplier onboarding</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-k-decision:#b87a00;--mv-kf-decision:#f6eede;--mv-k-terminal:#2c7d4f;--mv-kf-terminal:#e4eee8;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-k-decision:#e69f00;--mv-kf-decision:#29392a;--mv-k-terminal:#009e73;--mv-kf-terminal:#0b3939;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
[data-kind="decision"] .mv-shape{fill:var(--mv-kf-decision);stroke:var(--mv-k-decision)}
[data-kind="terminal"] .mv-shape{fill:var(--mv-kf-terminal);stroke:var(--mv-k-terminal)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-point{fill:var(--mv-edge);stroke:var(--mv-edge)}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-kind="decision"] .mv-stripe{fill:var(--mv-k-decision)}
[data-kind="terminal"] .mv-stripe{fill:var(--mv-k-terminal)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="425" height="656" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge mv-main" data-edge="req-chk" data-style="solid"><path class="mv-line" d="M141,88L141,129"/><polygon class="mv-head" points="141,136 145.5,127 136.5,127"/></g><g class="mv-edge" data-edge="chk-use" data-style="solid"><path class="mv-line" d="M77,166L59,166Q51,166 51,174L51,590Q51,598 59,598L70,598"/><polygon class="mv-head" points="77,598 68,593.5 68,602.5"/><text class="mv-label" style="text-anchor:end"><tspan class="mv-label-line" x="44" y="191">Yes</tspan></text></g><g class="mv-edge mv-main" data-edge="chk-form" data-style="solid"><path class="mv-line" d="M141,196L141,237"/><polygon class="mv-head" points="141,244 145.5,235 136.5,235"/><text class="mv-label" style="text-anchor:start"><tspan class="mv-label-line" x="148" y="221">No</tspan></text></g><g class="mv-edge mv-main" data-edge="form-vet" data-style="solid"><path class="mv-line" d="M141,304L141,345"/><polygon class="mv-head" points="141,352 145.5,343 136.5,343"/></g><g class="mv-edge" data-edge="vet-rej" data-style="solid"><path class="mv-line" d="M205,382L325,382Q333,382 333,390L333,453"/><polygon class="mv-head" points="333,460 337.5,451 328.5,451"/><text class="mv-label"><tspan class="mv-label-line" x="238.5" y="372">Fails</tspan></text></g><g class="mv-edge mv-main" data-edge="vet-add" data-style="solid"><path class="mv-line" d="M141,412L141,453"/><polygon class="mv-head" points="141,460 145.5,451 136.5,451"/><text class="mv-label" style="text-anchor:start"><tspan class="mv-label-line" x="148" y="437">Passes</tspan></text></g><g class="mv-edge mv-main" data-edge="add-use" data-style="solid"><path class="mv-line" d="M141,520L141,561"/><polygon class="mv-head" points="141,568 145.5,559 136.5,559"/></g></g><g></g><g><g class="mv-node" data-node="req" data-kind="step"><rect class="mv-shape" x="77" y="28" width="128" height="60" rx="8"/><text><tspan x="141" y="54.5">Request</tspan><tspan x="141" y="70.5">supplier</tspan></text></g><g class="mv-node" data-node="chk" data-kind="decision"><polygon class="mv-shape" points="141,136 205,166 141,196 77,166"/><text><tspan x="141" y="162.5">Already</tspan><tspan x="141" y="178.5">known?</tspan></text></g><g class="mv-node" data-node="use" data-kind="terminal"><rect class="mv-shape mv-pill" x="77" y="568" width="128" height="60" rx="30"/><text><tspan x="141" y="602.5">Use existing</tspan></text></g><g class="mv-node" data-node="form" data-kind="step"><rect class="mv-shape" x="77" y="244" width="128" height="60" rx="8"/><text><tspan x="141" y="270.5">Collect</tspan><tspan x="141" y="286.5">details</tspan></text></g><g class="mv-node" data-node="vet" data-kind="step"><rect class="mv-shape" x="77" y="352" width="128" height="60" rx="8"/><text><tspan x="141" y="386.5">Finance check</tspan></text></g><g class="mv-node" data-node="rej" data-kind="terminal"><rect class="mv-shape mv-pill" x="269" y="460" width="128" height="60" rx="30"/><text><tspan x="333" y="494.5">Rejected</tspan></text></g><g class="mv-node" data-node="add" data-kind="step"><rect class="mv-shape" x="77" y="460" width="128" height="60" rx="8"/><text><tspan x="141" y="494.5">Add to ERP</tspan></text></g></g>
</svg>
