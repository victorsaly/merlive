<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 1184 242" width="1184" height="242" role="img" aria-label="Supplier onboarding">
<title>Supplier onboarding</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-k-decision:#b87a00;--mv-kf-decision:#f6eede;--mv-k-terminal:#2c7d4f;--mv-kf-terminal:#e4eee8}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-k-decision:#e69f00;--mv-kf-decision:#29392a;--mv-k-terminal:#009e73;--mv-kf-terminal:#0b3939;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
[data-kind="decision"] .mv-shape{fill:var(--mv-kf-decision);stroke:var(--mv-k-decision)}
[data-kind="terminal"] .mv-shape{fill:var(--mv-kf-terminal);stroke:var(--mv-k-terminal)}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.6}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<g><g class="mv-edge" data-edge="req-chk" data-style="solid"><path class="mv-line" d="M156,58L221,58"/><polygon class="mv-head" points="228,58 219,53.5 219,62.5"/></g><g class="mv-edge" data-edge="chk-use" data-style="solid"><path class="mv-line" d="M292,88L292,206Q292,214 300,214L1084,214Q1092,214 1092,206L1092,95"/><polygon class="mv-head" points="1092,88 1087.5,97 1096.5,97"/><text class="mv-label" x="315" y="107">Yes</text></g><g class="mv-edge" data-edge="chk-form" data-style="solid"><path class="mv-line" d="M356,58L421,58"/><polygon class="mv-head" points="428,58 419,53.5 419,62.5"/><text class="mv-label" x="379.5" y="50">No</text></g><g class="mv-edge" data-edge="form-vet" data-style="solid"><path class="mv-line" d="M556,58L621,58"/><polygon class="mv-head" points="628,58 619,53.5 619,62.5"/></g><g class="mv-edge" data-edge="vet-rej" data-style="solid"><path class="mv-line" d="M692,88L692,150Q692,158 700,158L821,158"/><polygon class="mv-head" points="828,158 819,153.5 819,162.5"/><text class="mv-label" x="721.5" y="107">Fails</text></g><g class="mv-edge" data-edge="vet-add" data-style="solid"><path class="mv-line" d="M756,58L821,58"/><polygon class="mv-head" points="828,58 819,53.5 819,62.5"/><text class="mv-label" x="793" y="50">Passes</text></g><g class="mv-edge" data-edge="add-use" data-style="solid"><path class="mv-line" d="M956,58L1021,58"/><polygon class="mv-head" points="1028,58 1019,53.5 1019,62.5"/></g></g><g><g class="mv-node" data-node="req" data-kind="step"><rect class="mv-shape" x="28" y="28" width="128" height="60" rx="8"/><text><tspan x="92" y="54.5">Request</tspan><tspan x="92" y="70.5">supplier</tspan></text></g><g class="mv-node" data-node="chk" data-kind="decision"><polygon class="mv-shape" points="250,28 334,28 356,58 334,88 250,88 228,58"/><text><tspan x="292" y="54.5">Already</tspan><tspan x="292" y="70.5">known?</tspan></text></g><g class="mv-node" data-node="use" data-kind="terminal"><rect class="mv-shape mv-pill" x="1028" y="28" width="128" height="60" rx="30"/><text><tspan x="1092" y="62.5">Use existing</tspan></text></g><g class="mv-node" data-node="form" data-kind="step"><rect class="mv-shape" x="428" y="28" width="128" height="60" rx="8"/><text><tspan x="492" y="54.5">Collect</tspan><tspan x="492" y="70.5">details</tspan></text></g><g class="mv-node" data-node="vet" data-kind="step"><rect class="mv-shape" x="628" y="28" width="128" height="60" rx="8"/><text><tspan x="692" y="62.5">Finance check</tspan></text></g><g class="mv-node" data-node="rej" data-kind="terminal"><rect class="mv-shape mv-pill" x="828" y="128" width="128" height="60" rx="30"/><text><tspan x="892" y="162.5">Rejected</tspan></text></g><g class="mv-node" data-node="add" data-kind="step"><rect class="mv-shape" x="828" y="28" width="128" height="60" rx="8"/><text><tspan x="892" y="62.5">Add to ERP</tspan></text></g></g>
</svg>
