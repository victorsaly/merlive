<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 349 490" width="349" height="490" role="img" aria-label="Rows highlighted with a coloured background, one inside another">
<title>Rows highlighted with a coloured background, one inside another</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-group text{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase}
.mv-life{stroke:var(--mv-stroke);stroke-width:1.2;stroke-dasharray:4 4}
.mv-bar{fill:var(--mv-node);stroke:var(--mv-edge);stroke-width:1.2}
.mv-open{fill:none;stroke:var(--mv-edge);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mv-words{font-size:12px;font-weight:600;fill:var(--mv-text);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-num circle{fill:var(--mv-text)}
.mv-num text{font-size:10px;font-weight:700;fill:var(--mv-bg);text-anchor:middle}
.mv-note-box{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.2}
.mv-note-fold{fill:none;stroke:var(--mv-stroke);stroke-width:1.2}
.mv-note text{font-size:12px;fill:var(--mv-text);text-anchor:middle}
.mv-frame-box{fill:none;stroke:var(--mv-stroke);stroke-width:1.2}
[data-kind="rect"] .mv-frame-box{fill:var(--mv-text);fill-opacity:0.045;stroke:none}
.mv-frame-tab{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1.2}
.mv-frame-kind{font-size:10.5px;font-weight:700;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase}
.mv-frame-label{font-size:12px;font-weight:600;fill:var(--mv-muted);paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-frame-divide{stroke:var(--mv-stroke);stroke-width:1.2;stroke-dasharray:5 4}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="349" height="490" fill="url(#mv-dots)"/><g></g><g><g class="mv-frame" data-kind="rect" data-first="1"><rect class="mv-frame-box" x="28" y="90" width="292.8" height="305" rx="4"/></g><g class="mv-frame" data-kind="rect" data-first="2"><rect class="mv-frame-box" x="40" y="225" width="268.8" height="114" rx="4"/></g></g><g><line class="mv-life" x1="92.8" y1="68" x2="92.8" y2="462"/><line class="mv-life" x1="260.8" y1="68" x2="260.8" y2="462"/></g><g><rect class="mv-bar" data-of="ERP" data-first="1" x="255.8" y="201" width="10" height="181" rx="2"/><rect class="mv-bar" data-of="ERP" data-first="2" x="260.8" y="281" width="10" height="45" rx="2"/></g><g></g><g><g class="mv-edge" data-edge="m1" data-style="solid"><path class="mv-line" d="M92.8,201L248.8,201"/><polygon class="mv-head" points="246.8,196.5 255.8,201 246.8,205.5"/><text class="mv-words"><tspan x="176.8" y="191.7">Raise order</tspan></text></g><g class="mv-edge" data-edge="m2" data-style="solid"><path class="mv-line" d="M92.8,281L248.8,281"/><polygon class="mv-head" points="246.8,276.5 255.8,281 246.8,285.5"/><text class="mv-words"><tspan x="176.8" y="271.7">And one more</tspan></text></g><g class="mv-edge" data-edge="m3" data-style="dotted"><path class="mv-line" d="M255.8,326L99.8,326"/><polygon class="mv-head" points="101.8,330.5 92.8,326 101.8,321.5"/><text class="mv-words"><tspan x="176.8" y="316.7">Second order number</tspan></text></g><g class="mv-edge" data-edge="m4" data-style="dotted"><path class="mv-line" d="M255.8,382L99.8,382"/><polygon class="mv-head" points="101.8,386.5 92.8,382 101.8,377.5"/><text class="mv-words"><tspan x="176.8" y="372.7">First order number</tspan></text></g><g class="mv-edge" data-edge="m5" data-style="solid"><path class="mv-line" d="M92.8,438L253.8,438"/><polygon class="mv-head" points="251.8,433.5 260.8,438 251.8,442.5"/><text class="mv-words"><tspan x="176.8" y="428.7">Thanks</tspan></text></g></g><g><g class="mv-note" data-note="n1" data-over="Buyer" data-after="0"><path class="mv-note-box" d="M102.8,125H204.8L213.8,134V158H102.8Z"/><path class="mv-note-fold" d="M204.8,125V134H213.8"/><text><tspan x="158.3" y="145.7">The buyer asks</tspan></text></g></g><g><g class="mv-node" data-node="Buyer" data-kind="step"><rect class="mv-shape" x="44.8" y="28" width="96" height="40" rx="8"/><text><tspan x="92.8" y="52.5">Buyer</tspan></text></g><g class="mv-node" data-node="ERP" data-kind="step"><rect class="mv-shape" x="212.8" y="28" width="96" height="40" rx="8"/><text><tspan x="260.8" y="52.5">ERP</tspan></text></g></g>
</svg>
