<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 410 414" width="410" height="414" role="img" aria-label="Concurrency: regions of a composite state parted by --">
<title>Concurrency: regions of a composite state parted by --</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-terminal:#2c7d4f;--mv-kf-terminal:#e4eee8;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-terminal:#009e73;--mv-kf-terminal:#0b3939;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="terminal"] .mv-shape{fill:var(--mv-kf-terminal);stroke:var(--mv-k-terminal)}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="terminal"] .mv-stripe{fill:var(--mv-k-terminal)}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="410" height="414" fill="url(#mv-dots)"/><g><g class="mv-group"><rect x="14" y="96" width="368" height="290" rx="8"/></g><g class="mv-group"><rect x="26" y="122" width="152" height="252" rx="8"/></g><g class="mv-group"><rect x="218" y="122" width="152" height="252" rx="8"/></g></g><g><g class="mv-edge mv-main" data-edge="start-Sending_start" data-style="solid"><path class="mv-line" d="M102,72L102,127"/><polygon class="mv-head" points="102,134 106.5,125 97.5,125"/></g><g class="mv-edge mv-main" data-edge="Sending_start-Picking" data-style="solid"><path class="mv-line" d="M102,178L102,219"/><polygon class="mv-head" points="102,226 106.5,217 97.5,217"/></g><g class="mv-edge mv-main" data-edge="Picking-Packed" data-style="solid"><path class="mv-line" d="M102,270L102,311"/><polygon class="mv-head" points="102,318 106.5,309 97.5,309"/><text class="mv-label"><tspan class="mv-label-line" x="127" y="295">pack</tspan></text></g><g class="mv-edge" data-edge="Sending_2_start-Invoicing" data-style="solid"><path class="mv-line" d="M294,178L294,219"/><polygon class="mv-head" points="294,226 298.5,217 289.5,217"/></g><g class="mv-edge" data-edge="Invoicing-Paid" data-style="solid"><path class="mv-line" d="M294,270L294,311"/><polygon class="mv-head" points="294,318 298.5,309 289.5,309"/><text class="mv-label"><tspan class="mv-label-line" x="316" y="295">pay</tspan></text></g><g class="mv-edge" data-edge="start-Sending_2_start" data-style="solid"><path class="mv-line" d="M166,50L286,50Q294,50 294,58L294,127"/><polygon class="mv-head" points="294,134 298.5,125 289.5,125"/></g></g><g><text class="mv-name" x="51.5" y="112">Sending</text></g><g><g class="mv-node" data-node="start" data-kind="terminal"><rect class="mv-shape mv-pill" x="38" y="28" width="128" height="44" rx="22"/><text><tspan x="102" y="54.5">Start</tspan></text></g><g class="mv-node" data-node="Sending_start" data-kind="terminal"><rect class="mv-shape mv-pill" x="38" y="134" width="128" height="44" rx="22"/><text><tspan x="102" y="160.5">Start</tspan></text></g><g class="mv-node" data-node="Picking" data-kind="step"><rect class="mv-shape" x="38" y="226" width="128" height="44" rx="8"/><text><tspan x="102" y="252.5">Picking</tspan></text></g><g class="mv-node" data-node="Packed" data-kind="step"><rect class="mv-shape" x="38" y="318" width="128" height="44" rx="8"/><text><tspan x="102" y="344.5">Packed</tspan></text></g><g class="mv-node" data-node="Sending_2_start" data-kind="terminal"><rect class="mv-shape mv-pill" x="230" y="134" width="128" height="44" rx="22"/><text><tspan x="294" y="160.5">Start</tspan></text></g><g class="mv-node" data-node="Invoicing" data-kind="step"><rect class="mv-shape" x="230" y="226" width="128" height="44" rx="8"/><text><tspan x="294" y="252.5">Invoicing</tspan></text></g><g class="mv-node" data-node="Paid" data-kind="step"><rect class="mv-shape" x="230" y="318" width="128" height="44" rx="8"/><text><tspan x="294" y="344.5">Paid</tspan></text></g></g>
</svg>
