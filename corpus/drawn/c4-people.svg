<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 243 304" width="243" height="304" role="img" aria-label="People: one of the firm and one outside it">
<title>People: one of the firm and one outside it</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-k-external:#5a4fcf;--mv-kf-external:#eae8f9;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-k-external:#56b4e9;--mv-kf-external:#163c48;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
[data-kind="external"] .mv-shape{fill:var(--mv-kf-external);stroke:var(--mv-k-external)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-kind="external"] .mv-stripe{fill:var(--mv-k-external)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="243" height="304" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge" data-edge="buyer-rep" data-style="solid"><path class="mv-line" d="M92,128L92,169"/><polygon class="mv-head" points="92,176 96.5,167 87.5,167"/><text class="mv-label" style="text-anchor:start"><tspan class="mv-label-line" x="99" y="153">Asks for a quote</tspan></text></g></g><g></g><g><g class="mv-node" data-node="buyer" data-kind="step"><rect class="mv-shape" x="28" y="28" width="128" height="100" rx="8"/><path class="mv-icon" transform="translate(63.3,56)" d="M5.3 5.2A2.7 2.7 0 1 0 10.7 5.2A2.7 2.7 0 1 0 5.3 5.2M2.8 14C2.8 11.3 5 9.9 8 9.9C11 9.9 13.2 11.3 13.2 14"/><text class="mv-over" x="92" y="46">«person»</text><text><tspan x="103" y="68.5">Buyer</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="92" y="92">Works for the</tspan><tspan class="mv-told-line" x="92" y="107">firm</tspan></text></g><g class="mv-node" data-node="rep" data-kind="external"><rect class="mv-shape" x="28" y="176" width="128" height="100" rx="8"/><rect class="mv-stripe" x="29" y="184" width="4" height="84"/><path class="mv-icon" transform="translate(49.1,204)" d="M5.3 5.2A2.7 2.7 0 1 0 10.7 5.2A2.7 2.7 0 1 0 5.3 5.2M2.8 14C2.8 11.3 5 9.9 8 9.9C11 9.9 13.2 11.3 13.2 14"/><text class="mv-over" x="92" y="194">«external person»</text><text><tspan x="103" y="216.5">Sales rep</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="92" y="240">Works for the</tspan><tspan class="mv-told-line" x="92" y="255">supplier</tspan></text></g></g>
</svg>
