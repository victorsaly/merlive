<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 408 408" width="408" height="408" role="img" aria-label="Things done at once: par and and">
<title>Things done at once: par and and</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}
.mv-life{stroke:var(--mv-stroke);stroke-width:1.2;stroke-dasharray:4 4}
.mv-group-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle}
.mv-node[data-mark] .mv-shape,.mv-mark{stroke:var(--mv-edge);stroke-width:1.6}
.mv-mark{fill:none;stroke-linecap:round;stroke-linejoin:round}

.mv-dot{stroke:none}
.mv-bar{fill:var(--mv-node);stroke:var(--mv-edge);stroke-width:1.2}
.mv-open{fill:none;stroke:var(--mv-edge);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mv-words{font-size:12px;font-weight:600;fill:var(--mv-text);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-num circle{fill:var(--mv-text)}
.mv-num text{font-size:10px;font-weight:700;fill:var(--mv-bg);text-anchor:middle}
.mv-note-box{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.2}
.mv-note-fold{fill:none;stroke:var(--mv-stroke);stroke-width:1.2}
.mv-note text{font-size:12px;fill:var(--mv-text);text-anchor:middle}
.mv-frame-box{fill:none;stroke:var(--mv-stroke);stroke-width:1.2}
[data-kind="rect"] .mv-frame-box{fill:var(--mv-text);fill-opacity:0.045;stroke:none}
.mv-frame-tab{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1.2}
.mv-frame-kind{font-size:10.5px;font-weight:700;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase}
.mv-frame-label{font-size:12px;font-weight:600;fill:var(--mv-muted);paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-frame-divide{stroke:var(--mv-stroke);stroke-width:1.2;stroke-dasharray:5 4}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="408" height="408" fill="url(#mv-dots)"/><g></g><g><g class="mv-frame" data-kind="par" data-first="1"><rect class="mv-frame-box" x="28" y="90" width="352" height="138" rx="4"/><line class="mv-frame-divide" x1="28" y1="159" x2="380" y2="159"/></g></g><g><line class="mv-life" x1="76" y1="68" x2="76" y2="340"/><line class="mv-life" x1="204" y1="68" x2="204" y2="340"/><line class="mv-life" x1="332" y1="68" x2="332" y2="340"/></g><g></g><g><g class="mv-frame" data-kind="par" data-first="1"><path class="mv-frame-tab" d="M28,90H65.6V102L59.6,108H28Z"/><text class="mv-frame-kind" x="36" y="103">par</text><text class="mv-frame-label" x="92" y="104">To the supplier</text><text class="mv-frame-label" x="92" y="175">To the warehouse</text></g></g><g><g class="mv-edge" data-edge="m1" data-style="solid"><path class="mv-line" d="M76,146L197,146"/><polygon class="mv-head" points="195,141.5 204,146 195,150.5"/><text class="mv-words"><tspan x="140" y="136.7">Send order</tspan></text></g><g class="mv-edge" data-edge="m2" data-style="solid"><path class="mv-line" d="M76,215L325,215"/><polygon class="mv-head" points="323,210.5 332,215 323,219.5"/><text class="mv-words"><tspan x="140" y="205.7">Make room</tspan></text></g><g class="mv-edge" data-edge="m3" data-style="dotted"><path class="mv-line" d="M204,271L83,271"/><polygon class="mv-head" points="85,275.5 76,271 85,266.5"/><text class="mv-words"><tspan x="140" y="261.7">Confirmed</tspan></text></g><g class="mv-edge" data-edge="m4" data-style="dotted"><path class="mv-line" d="M332,316L83,316"/><polygon class="mv-head" points="85,320.5 76,316 85,311.5"/><text class="mv-words"><tspan x="268" y="306.7">Ready</tspan></text></g></g><g></g><g><g class="mv-node" data-node="ERP" data-kind="step"><rect class="mv-shape" x="28" y="28" width="96" height="40" rx="8"/><text><tspan x="76" y="52.5">ERP</tspan></text></g><g class="mv-node" data-node="Supplier" data-kind="step"><rect class="mv-shape" x="156" y="28" width="96" height="40" rx="8"/><text><tspan x="204" y="52.5">Supplier</tspan></text></g><g class="mv-node" data-node="Warehouse" data-kind="step"><rect class="mv-shape" x="284" y="28" width="96" height="40" rx="8"/><text><tspan x="332" y="52.5">Warehouse</tspan></text></g><g class="mv-node" data-node="ERP" data-kind="step"><rect class="mv-shape" x="28" y="340" width="96" height="40" rx="8"/><text><tspan x="76" y="364.5">ERP</tspan></text></g><g class="mv-node" data-node="Supplier" data-kind="step"><rect class="mv-shape" x="156" y="340" width="96" height="40" rx="8"/><text><tspan x="204" y="364.5">Supplier</tspan></text></g><g class="mv-node" data-node="Warehouse" data-kind="step"><rect class="mv-shape" x="284" y="340" width="96" height="40" rx="8"/><text><tspan x="332" y="364.5">Warehouse</tspan></text></g></g>
</svg>
