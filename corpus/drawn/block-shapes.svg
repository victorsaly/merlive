<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 184 1296" width="184" height="1296" role="img" aria-label="Every shape of a block, joined in a chain">
<title>Every shape of a block, joined in a chain</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-k-terminal:#2c7d4f;--mv-kf-terminal:#e4eee8;--mv-k-data:#0a84c4;--mv-kf-data:#dfeff7;--mv-k-decision:#b87a00;--mv-kf-decision:#f6eede;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-k-terminal:#009e73;--mv-kf-terminal:#0b3939;--mv-k-data:#0072b2;--mv-kf-data:#0b3341;--mv-k-decision:#e69f00;--mv-kf-decision:#29392a;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
[data-kind="terminal"] .mv-shape{fill:var(--mv-kf-terminal);stroke:var(--mv-k-terminal)}
[data-kind="data"] .mv-shape{fill:var(--mv-kf-data);stroke:var(--mv-k-data)}
[data-kind="decision"] .mv-shape{fill:var(--mv-kf-decision);stroke:var(--mv-k-decision)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-point{fill:var(--mv-edge);stroke:var(--mv-edge)}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-kind="terminal"] .mv-stripe{fill:var(--mv-k-terminal)}
[data-kind="data"] .mv-stripe{fill:var(--mv-k-data)}
[data-kind="decision"] .mv-stripe{fill:var(--mv-k-decision)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="184" height="1296" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge mv-main" data-edge="a-b" data-style="solid"><path class="mv-line" d="M92,72L92,113"/><polygon class="mv-head" points="92,120 96.5,111 87.5,111"/></g><g class="mv-edge mv-main" data-edge="b-c" data-style="solid"><path class="mv-line" d="M92,164L92,205"/><polygon class="mv-head" points="92,212 96.5,203 87.5,203"/></g><g class="mv-edge mv-main" data-edge="c-d" data-style="solid"><path class="mv-line" d="M92,256L92,297"/><polygon class="mv-head" points="92,304 96.5,295 87.5,295"/></g><g class="mv-edge mv-main" data-edge="d-e" data-style="solid"><path class="mv-line" d="M92,348L92,389"/><polygon class="mv-head" points="92,396 96.5,387 87.5,387"/></g><g class="mv-edge mv-main" data-edge="e-f" data-style="solid"><path class="mv-line" d="M92,440L92,481"/><polygon class="mv-head" points="92,488 96.5,479 87.5,479"/></g><g class="mv-edge mv-main" data-edge="f-g" data-style="solid"><path class="mv-line" d="M92,532L92,573"/><polygon class="mv-head" points="92,580 96.5,571 87.5,571"/></g><g class="mv-edge mv-main" data-edge="g-h" data-style="solid"><path class="mv-line" d="M92,624L92,665"/><polygon class="mv-head" points="92,672 96.5,663 87.5,663"/></g><g class="mv-edge mv-main" data-edge="h-i" data-style="solid"><path class="mv-line" d="M92,716L92,757"/><polygon class="mv-head" points="92,764 96.5,755 87.5,755"/></g><g class="mv-edge mv-main" data-edge="i-j" data-style="solid"><path class="mv-line" d="M92,808L92,849"/><polygon class="mv-head" points="92,856 96.5,847 87.5,847"/></g><g class="mv-edge mv-main" data-edge="j-k" data-style="solid"><path class="mv-line" d="M92,900L92,941"/><polygon class="mv-head" points="92,948 96.5,939 87.5,939"/></g><g class="mv-edge mv-main" data-edge="k-l" data-style="solid"><path class="mv-line" d="M92,992L92,1033"/><polygon class="mv-head" points="92,1040 96.5,1031 87.5,1031"/></g><g class="mv-edge mv-main" data-edge="l-m" data-style="solid"><path class="mv-line" d="M92,1084L92,1125"/><polygon class="mv-head" points="92,1132 96.5,1123 87.5,1123"/></g><g class="mv-edge mv-main" data-edge="m-n" data-style="solid"><path class="mv-line" d="M92,1176L92,1217"/><polygon class="mv-head" points="92,1224 96.5,1215 87.5,1215"/></g></g><g></g><g><g class="mv-node" data-node="a" data-kind="step"><rect class="mv-shape" x="28" y="28" width="128" height="44" rx="8"/><text><tspan x="92" y="54.5">Box</tspan></text></g><g class="mv-node" data-node="b" data-kind="step"><rect class="mv-shape" x="28" y="120" width="128" height="44" rx="8"/><text><tspan x="92" y="146.5">Round</tspan></text></g><g class="mv-node" data-node="c" data-kind="terminal"><rect class="mv-shape mv-pill" x="28" y="212" width="128" height="44" rx="22"/><text><tspan x="92" y="238.5">Stadium</tspan></text></g><g class="mv-node" data-node="d" data-kind="step"><rect class="mv-shape" x="28" y="304" width="128" height="44" rx="8"/><path class="mv-shape mv-detail" d="M36,304V348M148,304V348"/><text><tspan x="92" y="330.5">Subroutine</tspan></text></g><g class="mv-node" data-node="e" data-kind="data"><path class="mv-shape" d="M28,403A64,7 0 0 1 156,403V433A64,7 0 0 1 28,433Z"/><path class="mv-shape mv-detail" d="M28,403A64,7 0 0 0 156,403"/><text><tspan x="92" y="426">Database</tspan></text></g><g class="mv-node" data-node="f" data-kind="terminal"><rect class="mv-shape mv-pill" x="28" y="488" width="128" height="44" rx="22"/><text><tspan x="92" y="514.5">Circle</tspan></text></g><g class="mv-node" data-node="g" data-kind="step"><polygon class="mv-shape" points="28,580 156,580 156,624 28,624 42,602"/><text><tspan x="99" y="606.5">Flag</tspan></text></g><g class="mv-node" data-node="h" data-kind="decision"><polygon class="mv-shape" points="92,672 156,694 92,716 28,694"/><text><tspan x="92" y="698.5">Decision</tspan></text></g><g class="mv-node" data-node="i" data-kind="decision"><polygon class="mv-shape" points="44,764 140,764 156,786 140,808 44,808 28,786"/><text><tspan x="92" y="790.5">Prepare</tspan></text></g><g class="mv-node" data-node="j" data-kind="step"><polygon class="mv-shape" points="42,856 156,856 142,900 28,900"/><text><tspan x="92" y="882.5">Input</tspan></text></g><g class="mv-node" data-node="k" data-kind="step"><polygon class="mv-shape" points="28,948 142,948 156,992 42,992"/><text><tspan x="92" y="974.5">Output</tspan></text></g><g class="mv-node" data-node="l" data-kind="step"><polygon class="mv-shape" points="42,1040 142,1040 156,1084 28,1084"/><text><tspan x="92" y="1066.5">Manual</tspan></text></g><g class="mv-node" data-node="m" data-kind="step"><polygon class="mv-shape" points="28,1132 156,1132 142,1176 42,1176"/><text><tspan x="92" y="1158.5">Trapezoid</tspan></text></g><g class="mv-node" data-node="n" data-kind="terminal"><rect class="mv-shape mv-pill" x="28" y="1224" width="128" height="44" rx="22"/><rect class="mv-shape mv-detail mv-pill" x="32" y="1228" width="120" height="36" rx="18"/><text><tspan x="92" y="1250.5">Stop</tspan></text></g></g>
</svg>
