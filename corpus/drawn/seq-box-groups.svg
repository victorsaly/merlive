<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 556 347" width="556" height="347" role="img" aria-label="Participants grouped in boxes, with and without a colour and a title">
<title>Participants grouped in boxes, with and without a colour and a title</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-k-terminal:#2c7d4f;--mv-kf-terminal:#e4eee8;--mv-k-data:#0a84c4;--mv-kf-data:#dfeff7;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-k-terminal:#009e73;--mv-kf-terminal:#0b3939;--mv-k-data:#0072b2;--mv-kf-data:#0b3341;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-point{fill:var(--mv-edge);stroke:var(--mv-edge)}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}
.mv-life{stroke:var(--mv-stroke);stroke-width:1.2;stroke-dasharray:4 4}
.mv-group-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle}
.mv-node[data-mark] .mv-shape,.mv-mark{stroke:var(--mv-edge);stroke-width:1.6}
.mv-mark{fill:none;stroke-linecap:round;stroke-linejoin:round}

.mv-dot{stroke:none}
.mv-bar{fill:var(--mv-node);stroke:var(--mv-edge);stroke-width:1.2}
.mv-open{fill:none;stroke:var(--mv-edge);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mv-words{font-size:12px;font-weight:600;fill:var(--mv-text);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-num circle{fill:var(--mv-text)}
.mv-num text{font-size:10px;font-weight:700;fill:var(--mv-bg);text-anchor:middle}
.mv-note-box{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.2}
.mv-note-fold{fill:none;stroke:var(--mv-stroke);stroke-width:1.2}
.mv-note text{font-size:12px;fill:var(--mv-text);text-anchor:middle}
.mv-frame-box{fill:none;stroke:var(--mv-stroke);stroke-width:1.2}
[data-kind="rect"] .mv-frame-box{fill:var(--mv-text);fill-opacity:0.045;stroke:none}
.mv-frame[data-hue="terminal"] .mv-frame-box,.mv-group[data-hue="terminal"] rect{fill:var(--mv-k-terminal);fill-opacity:0.1}
.mv-frame[data-hue="data"] .mv-frame-box,.mv-group[data-hue="data"] rect{fill:var(--mv-k-data);fill-opacity:0.1}
.mv-frame-tab{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1.2}
.mv-frame-kind{font-size:10.5px;font-weight:700;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase}
.mv-frame-label{font-size:12px;font-weight:600;fill:var(--mv-muted);paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-frame-divide{stroke:var(--mv-stroke);stroke-width:1.2;stroke-dasharray:5 4}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="556" height="347" fill="url(#mv-dots)"/><g><g class="mv-group" data-hue="terminal"><rect x="28" y="28" width="244" height="291" rx="8"/><text class="mv-group-name"><tspan x="150" y="63">Buying</tspan></text></g><g class="mv-group" data-hue="data"><rect x="284" y="28" width="116" height="291" rx="8"/></g><g class="mv-group"><rect x="412" y="28" width="116" height="291" rx="8"/><text class="mv-group-name"><tspan x="470" y="49">Outside the</tspan><tspan x="470" y="63">firm</tspan></text></g></g><g></g><g><line class="mv-life" x1="86" y1="112" x2="86" y2="269"/><line class="mv-life" x1="214" y1="112" x2="214" y2="269"/><line class="mv-life" x1="342" y1="112" x2="342" y2="269"/><line class="mv-life" x1="470" y1="112" x2="470" y2="269"/></g><g></g><g></g><g><g class="mv-edge" data-edge="m1" data-style="solid"><path class="mv-line" d="M86,155L207,155"/><polygon class="mv-head" points="205,150.5 214,155 205,159.5"/><text class="mv-words"><tspan x="150" y="145.7">Raise order</tspan></text></g><g class="mv-edge" data-edge="m2" data-style="solid"><path class="mv-line" d="M214,200L335,200"/><polygon class="mv-head" points="333,195.5 342,200 333,204.5"/><text class="mv-words"><tspan x="278" y="190.7">Check stock</tspan></text></g><g class="mv-edge" data-edge="m3" data-style="solid"><path class="mv-line" d="M214,245L463,245"/><polygon class="mv-head" points="461,240.5 470,245 461,249.5"/><text class="mv-words"><tspan x="278" y="235.7">Send order</tspan></text></g></g><g></g><g><g class="mv-node" data-node="B" data-kind="step"><rect class="mv-shape" x="38" y="72" width="96" height="40" rx="8"/><text><tspan x="86" y="96.5">Buyer</tspan></text></g><g class="mv-node" data-node="E" data-kind="step"><rect class="mv-shape" x="166" y="72" width="96" height="40" rx="8"/><text><tspan x="214" y="96.5">ERP</tspan></text></g><g class="mv-node" data-node="W" data-kind="step"><rect class="mv-shape" x="294" y="72" width="96" height="40" rx="8"/><text><tspan x="342" y="96.5">Warehouse</tspan></text></g><g class="mv-node" data-node="S" data-kind="step"><rect class="mv-shape" x="422" y="72" width="96" height="40" rx="8"/><text><tspan x="470" y="96.5">Supplier</tspan></text></g><g class="mv-node" data-node="B" data-kind="step"><rect class="mv-shape" x="38" y="269" width="96" height="40" rx="8"/><text><tspan x="86" y="293.5">Buyer</tspan></text></g><g class="mv-node" data-node="E" data-kind="step"><rect class="mv-shape" x="166" y="269" width="96" height="40" rx="8"/><text><tspan x="214" y="293.5">ERP</tspan></text></g><g class="mv-node" data-node="W" data-kind="step"><rect class="mv-shape" x="294" y="269" width="96" height="40" rx="8"/><text><tspan x="342" y="293.5">Warehouse</tspan></text></g><g class="mv-node" data-node="S" data-kind="step"><rect class="mv-shape" x="422" y="269" width="96" height="40" rx="8"/><text><tspan x="470" y="293.5">Supplier</tspan></text></g></g>
</svg>
