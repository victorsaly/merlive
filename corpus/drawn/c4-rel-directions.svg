<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 458 432" width="458" height="432" role="img" aria-label="Relations that say which way Mermaid should draw them">
<title>Relations that say which way Mermaid should draw them</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="458" height="432" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge" data-edge="erp-stock" data-style="solid"><path class="mv-line" d="M174,86L174,127"/><polygon class="mv-head" points="174,134 178.5,125 169.5,125"/><text class="mv-label" style="text-anchor:start"><tspan class="mv-label-line" x="181" y="111">Checks stock with</tspan></text></g><g class="mv-edge" data-edge="stock-ledger" data-style="solid"><path class="mv-line" d="M174,192L174,233"/><polygon class="mv-head" points="174,240 178.5,231 169.5,231"/><text class="mv-label" style="text-anchor:start"><tspan class="mv-label-line" x="181" y="217">Values stock in</tspan></text></g><g class="mv-edge" data-edge="erp-ledger" data-style="solid"><path class="mv-line" d="M110,67L92,67Q84,67 84,75L84,261Q84,269 92,269L103,269"/><polygon class="mv-head" points="110,269 101,264.5 101,273.5"/><text class="mv-label" style="text-anchor:end"><tspan class="mv-label-line" x="77" y="92">Posts to</tspan></text></g><g class="mv-edge" data-edge="ledger-bank" data-style="solid"><path class="mv-line" d="M174,298L174,339"/><polygon class="mv-head" points="174,346 178.5,337 169.5,337"/><text class="mv-label" style="text-anchor:start"><tspan class="mv-label-line" x="181" y="323">Pays through</tspan></text></g><g class="mv-edge" data-edge="erp-mail" data-style="solid"><path class="mv-line" d="M238,57L368,57Q376,57 376,65L376,233"/><polygon class="mv-head" points="376,240 380.5,231 371.5,231"/><text class="mv-label"><tspan class="mv-label-line" x="298" y="47">Sends through</tspan></text></g><g class="mv-edge" data-edge="mail-bank" data-style="solid"><path class="mv-line" d="M366,298L366,367Q366,375 358,375L245,375"/><polygon class="mv-head" points="238,375 247,379.5 247,370.5"/><text class="mv-label" style="text-anchor:start"><tspan class="mv-label-line" x="373" y="323">Copies</tspan></text></g><g class="mv-edge" data-edge="erp-bank" data-style="solid"><path class="mv-line" d="M110,47L76,47Q68,47 68,55L68,367Q68,375 76,375L103,375"/><polygon class="mv-head" points="110,375 101,370.5 101,379.5"/><text class="mv-label"><tspan class="mv-label-line" x="89" y="37">Asks</tspan></text></g><g class="mv-edge" data-edge="stock-mail" data-style="solid"><path class="mv-line" d="M238,163L348,163Q356,163 356,171L356,233"/><polygon class="mv-head" points="356,240 360.5,231 351.5,231"/><text class="mv-label"><tspan class="mv-label-line" x="297" y="153">Warns through</tspan></text></g></g><g></g><g><g class="mv-node" data-node="erp" data-kind="step"><rect class="mv-shape" x="110" y="28" width="128" height="58" rx="8"/><text class="mv-over" x="174" y="46">«system»</text><text><tspan x="174" y="68.5">ERP</tspan></text></g><g class="mv-node" data-node="stock" data-kind="step"><rect class="mv-shape" x="110" y="134" width="128" height="58" rx="8"/><text class="mv-over" x="174" y="152">«system»</text><text><tspan x="174" y="174.5">Stock control</tspan></text></g><g class="mv-node" data-node="ledger" data-kind="step"><rect class="mv-shape" x="110" y="240" width="128" height="58" rx="8"/><text class="mv-over" x="174" y="258">«system»</text><text><tspan x="174" y="280.5">Ledger</tspan></text></g><g class="mv-node" data-node="mail" data-kind="step"><rect class="mv-shape" x="302" y="240" width="128" height="58" rx="8"/><text class="mv-over" x="366" y="258">«system»</text><text><tspan x="366" y="280.5">Mail</tspan></text></g><g class="mv-node" data-node="bank" data-kind="step"><rect class="mv-shape" x="110" y="346" width="128" height="58" rx="8"/><text class="mv-over" x="174" y="364">«system»</text><text><tspan x="174" y="386.5">Bank link</tspan></text></g></g>
</svg>
