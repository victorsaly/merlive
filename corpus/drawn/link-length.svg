<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 402 376" width="402" height="376" role="img" aria-label="Links drawn longer, to push a box further on">
<title>Links drawn longer, to push a box further on</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-k-decision:#b87a00;--mv-kf-decision:#f6eede;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-k-decision:#e69f00;--mv-kf-decision:#29392a;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
[data-kind="decision"] .mv-shape{fill:var(--mv-kf-decision);stroke:var(--mv-k-decision)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-kind="decision"] .mv-stripe{fill:var(--mv-k-decision)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="402" height="376" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge mv-main" data-edge="A-B" data-style="solid"><path class="mv-line" d="M118,72L118,113"/><polygon class="mv-head" points="118,120 122.5,111 113.5,111"/></g><g class="mv-edge mv-main" data-edge="B-C" data-style="solid"><path class="mv-line" d="M118,164L118,205"/><polygon class="mv-head" points="118,212 122.5,203 113.5,203"/><text class="mv-label"><tspan class="mv-label-line" x="140" y="189">Yes</tspan></text></g><g class="mv-edge" data-edge="B-D" data-style="solid"><path class="mv-line" d="M182,142L302,142Q310,142 310,150L310,205"/><polygon class="mv-head" points="310,212 314.5,203 305.5,203"/><text class="mv-label"><tspan class="mv-label-line" x="205.5" y="132">No</tspan></text></g><g class="mv-edge mv-main" data-edge="C-E" data-style="solid"><path class="mv-line" d="M118,256L118,297"/><polygon class="mv-head" points="118,304 122.5,295 113.5,295"/><text class="mv-label"><tspan class="mv-label-line" x="143" y="281">then</tspan></text></g><g class="mv-edge" data-edge="D-E" data-style="dotted"><path class="mv-line" d="M310,256L310,318Q310,326 302,326L189,326"/><polygon class="mv-head" points="182,326 191,330.5 191,321.5"/></g><g class="mv-edge" data-edge="A-E" data-style="thick"><path class="mv-line" d="M54,50L36,50Q28,50 28,58L28,318Q28,326 36,326L47,326"/><polygon class="mv-head" points="54,326 45,321.5 45,330.5"/></g></g><g></g><g><g class="mv-node" data-node="A" data-kind="step"><rect class="mv-shape" x="54" y="28" width="128" height="44" rx="8"/><text><tspan x="118" y="54.5">Order</tspan></text></g><g class="mv-node" data-node="B" data-kind="decision"><polygon class="mv-shape" points="118,120 182,142 118,164 54,142"/><text><tspan x="118" y="146.5">In stock?</tspan></text></g><g class="mv-node" data-node="C" data-kind="step"><rect class="mv-shape" x="54" y="212" width="128" height="44" rx="8"/><text><tspan x="118" y="238.5">Pick</tspan></text></g><g class="mv-node" data-node="D" data-kind="step"><rect class="mv-shape" x="246" y="212" width="128" height="44" rx="8"/><text><tspan x="310" y="238.5">Back order</tspan></text></g><g class="mv-node" data-node="E" data-kind="step"><rect class="mv-shape" x="54" y="304" width="128" height="44" rx="8"/><text><tspan x="118" y="330.5">Ship</tspan></text></g></g>
</svg>
