<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 376 468" width="376" height="468" role="img" aria-label="A fork and a join">
<title>A fork and a join</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-fork:#b3cbc7;--mv-kf-fork:#ffffff;--mv-k-join:#b3cbc7;--mv-kf-join:#ffffff;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-fork:#2b5560;--mv-kf-fork:#0d2a30;--mv-k-join:#2b5560;--mv-kf-join:#0d2a30;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="fork"] .mv-shape{fill:var(--mv-kf-fork);stroke:var(--mv-k-fork)}
[data-kind="join"] .mv-shape{fill:var(--mv-kf-join);stroke:var(--mv-k-join)}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
.mv-node .mv-detail{fill:none}
.mv-node .mv-bar{fill:var(--mv-edge);stroke:var(--mv-edge)}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-point{fill:var(--mv-edge);stroke:var(--mv-edge)}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="fork"] .mv-stripe{fill:var(--mv-k-fork)}
[data-kind="join"] .mv-stripe{fill:var(--mv-k-join)}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="376" height="468" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge mv-main" data-edge="Approved-split" data-style="solid"><path class="mv-line" d="M92,72L92,131"/><polygon class="mv-head" points="92,138 96.5,129 87.5,129"/></g><g class="mv-edge mv-main" data-edge="split-Picking" data-style="solid"><path class="mv-line" d="M92,146L92,205"/><polygon class="mv-head" points="92,212 96.5,203 87.5,203"/></g><g class="mv-edge" data-edge="split-Invoicing" data-style="solid"><path class="mv-line" d="M112,146L112,180Q112,188 120,188L276,188Q284,188 284,196L284,205"/><polygon class="mv-head" points="284,212 288.5,203 279.5,203"/></g><g class="mv-edge mv-main" data-edge="Picking-together" data-style="solid"><path class="mv-line" d="M92,256L92,315"/><polygon class="mv-head" points="92,322 96.5,313 87.5,313"/></g><g class="mv-edge" data-edge="Invoicing-together" data-style="solid"><path class="mv-line" d="M284,256L284,272Q284,280 276,280L120,280Q112,280 112,288L112,315"/><polygon class="mv-head" points="112,322 116.5,313 107.5,313"/></g><g class="mv-edge mv-main" data-edge="together-Sent" data-style="solid"><path class="mv-line" d="M92,330L92,389"/><polygon class="mv-head" points="92,396 96.5,387 87.5,387"/></g></g><g></g><g><g class="mv-node" data-node="split" data-kind="fork"><rect class="mv-shape mv-bar" x="28" y="138" width="128" height="8" rx="2"/><text></text></g><g class="mv-node" data-node="together" data-kind="join"><rect class="mv-shape mv-bar" x="28" y="322" width="128" height="8" rx="2"/><text></text></g><g class="mv-node" data-node="Approved" data-kind="step"><rect class="mv-shape" x="28" y="28" width="128" height="44" rx="8"/><text><tspan x="92" y="54.5">Approved</tspan></text></g><g class="mv-node" data-node="Picking" data-kind="step"><rect class="mv-shape" x="28" y="212" width="128" height="44" rx="8"/><text><tspan x="92" y="238.5">Picking</tspan></text></g><g class="mv-node" data-node="Invoicing" data-kind="step"><rect class="mv-shape" x="220" y="212" width="128" height="44" rx="8"/><text><tspan x="284" y="238.5">Invoicing</tspan></text></g><g class="mv-node" data-node="Sent" data-kind="step"><rect class="mv-shape" x="28" y="396" width="128" height="44" rx="8"/><text><tspan x="92" y="422.5">Sent</tspan></text></g></g>
</svg>
