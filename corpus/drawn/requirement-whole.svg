<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 504 617" width="504" height="617" role="img" aria-label="A whole diagram: requirements of three kinds, two elements, and how they bear on each other">
<title>A whole diagram: requirements of three kinds, two elements, and how they bear on each other</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-point{fill:var(--mv-edge);stroke:var(--mv-edge)}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="504" height="617" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge" data-edge="approval-limit" data-style="solid"><path class="mv-line" d="M380,403L380,444"/><circle class="mv-head" cx="380" cy="400.5" r="3.5"/><text class="mv-label" style="text-anchor:start"><tspan class="mv-label-line" x="387" y="421">contains</tspan></text></g><g class="mv-edge" data-edge="speed-approval" data-style="dotted"><path class="mv-line" d="M380,188L380,229"/><polygon class="mv-head" points="380,236 384.5,227 375.5,227"/><text class="mv-label" style="text-anchor:start"><tspan class="mv-label-line" x="387" y="213">derives</tspan></text></g><g class="mv-edge" data-edge="approval_flow-approval" data-style="dotted"><path class="mv-line" d="M124,159L124,204Q124,212 132,212L352,212Q360,212 360,220L360,229"/><polygon class="mv-head" points="360,236 364.5,227 355.5,227"/><text class="mv-label" style="text-anchor:start"><tspan class="mv-label-line" x="131" y="184">satisfies</tspan></text></g><g class="mv-edge" data-edge="test_suite-limit" data-style="dotted"><path class="mv-line" d="M124,367L124,508.5Q124,516.5 132,516.5L277,516.5"/><polygon class="mv-head" points="284,516.5 275,512 275,521"/><text class="mv-label" style="text-anchor:start"><tspan class="mv-label-line" x="131" y="392">verifies</tspan></text></g></g><g></g><g><g class="mv-node" data-node="approval" data-kind="step"><rect class="mv-shape" x="284" y="236" width="192" height="160" rx="8"/><text class="mv-over" x="380" y="254">«requirement»</text><text><tspan x="380" y="276.5">approval</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="380" y="300">Orders over the limit are</tspan><tspan class="mv-told-line" x="380" y="315">approved by a manager.</tspan></text><path class="mv-shape mv-detail" d="M284,336H476"/><text class="mv-rows" xml:space="preserve"><tspan class="mv-row" x="296" y="354">id: 1</tspan><tspan class="mv-row" x="296" y="370">risk: high</tspan><tspan class="mv-row" x="296" y="386">verify: test</tspan></text></g><g class="mv-node" data-node="limit" data-kind="step"><rect class="mv-shape" x="284" y="444" width="192" height="145" rx="8"/><text class="mv-over" x="380" y="462">«functional requirement»</text><text><tspan x="380" y="484.5">limit</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="380" y="508">The limit is set per buyer.</tspan></text><path class="mv-shape mv-detail" d="M284,529H476"/><text class="mv-rows" xml:space="preserve"><tspan class="mv-row" x="296" y="547">id: 1.1</tspan><tspan class="mv-row" x="296" y="563">risk: medium</tspan><tspan class="mv-row" x="296" y="579">verify: inspection</tspan></text></g><g class="mv-node" data-node="speed" data-kind="step"><rect class="mv-shape" x="284" y="28" width="192" height="160" rx="8"/><text class="mv-over" x="380" y="46">«performance requirement»</text><text><tspan x="380" y="68.5">speed</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="380" y="92">An approval is asked for</tspan><tspan class="mv-told-line" x="380" y="107">within a minute.</tspan></text><path class="mv-shape mv-detail" d="M284,128H476"/><text class="mv-rows" xml:space="preserve"><tspan class="mv-row" x="296" y="146">id: 1.2</tspan><tspan class="mv-row" x="296" y="162">risk: low</tspan><tspan class="mv-row" x="296" y="178">verify: analysis</tspan></text></g><g class="mv-node" data-node="approval_flow" data-kind="step"><rect class="mv-shape" x="28" y="57" width="192" height="102" rx="8"/><text class="mv-over" x="124" y="75">«element»</text><text><tspan x="124" y="97.5">approval_flow</tspan></text><path class="mv-shape mv-detail" d="M28,115H220"/><text class="mv-rows" xml:space="preserve"><tspan class="mv-row" x="40" y="133">type: workflow</tspan><tspan class="mv-row" x="40" y="149">doc: docs/approval.md</tspan></text></g><g class="mv-node" data-node="test_suite" data-kind="step"><rect class="mv-shape" x="28" y="265" width="192" height="102" rx="8"/><text class="mv-over" x="124" y="283">«element»</text><text><tspan x="124" y="305.5">test_suite</tspan></text><path class="mv-shape mv-detail" d="M28,323H220"/><text class="mv-rows" xml:space="preserve"><tspan class="mv-row" x="40" y="341">type: tests</tspan><tspan class="mv-row" x="40" y="357">doc: tests/approval</tspan></text></g></g>
</svg>
