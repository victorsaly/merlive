ect class="mv-shape" x="604" y="28" width="128" height="44" rx="8"/><text><tspan x="668" y="54.5">n18</tspan></text></g><g class="mv-node" data-node="n19" data-kind="step"><rect class="mv-shape" x="604" y="120" width="128" height="44" rx="8"/><text><tspan x="668" y="146.5">n19</tspan></text></g><g class="mv-node" data-node="n27" data-kind="step"><rect class="mv-shape" x="412" y="28" width="128" height="44" rx="8"/><text><tspan x="476" y="54.5">n27</tspan></text></g><g class="mv-node" data-node="n28" data-kind="step"><rect class="mv-shape" x="412" y="120" width="128" height="44" rx="8"/><text><tspan x="476" y="146.5">n28</tspan></text></g><g class="mv-node" data-node="n36" data-kind="step"><rect class="mv-shape" x="220" y="28" width="128" height="44" rx="8"/><text><tspan x="284" y="54.5">n36</tspan></text></g><g class="mv-node" data-node="n37" data-kind="step"><rect class="mv-shape" x="220" y="120" width="128" height="44" rx="8"/><text><tspan x="284" y="146.5">n37</tspan></text></g><g class="mv-node" data-node="n45" data-kind="step"><rect class="mv-shape" x="28" y="28" width="128" height="44" rx="8"/><text><tspan x="92" y="54.5">n45</tspan></text></g><g class="mv-node" data-node="n46" data-kind="step"><rect class="mv-shape" x="28" y="120" width="128" height="44" rx="8"/><text><tspan x="92" y="146.5">n46</tspan></text></g></g>
</svg>
