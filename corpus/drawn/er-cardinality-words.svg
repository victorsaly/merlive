<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 376 376" width="376" height="376" role="img" aria-label="How many, written in words">
<title>How many, written in words</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="376" height="376" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge" data-edge="SUPPLIER-ORDER" data-style="solid"><path class="mv-line" d="M92,164L92,212"/><path class="mv-cross" d="M86.5,169L97.5,169M86.5,173L97.5,173"/><path class="mv-cross" d="M92,203L97.5,212M92,203L86.5,212"/><circle class="mv-hollow" cx="92" cy="198.5" r="3.5"/><text class="mv-label"><tspan class="mv-label-line" x="130.5" y="189">receives</tspan></text></g><g class="mv-edge" data-edge="ORDER-ORDER_LINE" data-style="solid"><path class="mv-line" d="M92,256L92,304"/><path class="mv-cross" d="M86.5,261L97.5,261M86.5,265L97.5,265"/><path class="mv-cross" d="M92,295L97.5,304M92,295L86.5,304M97.5,292L86.5,292"/><text class="mv-label"><tspan class="mv-label-line" x="130.5" y="281">contains</tspan></text></g><g class="mv-edge" data-edge="ORDER-INVOICE" data-style="solid"><path class="mv-line" d="M156,234L276,234Q284,234 284,242L284,304"/><path class="mv-cross" d="M161,239.5L161,228.5"/><circle class="mv-hollow" cx="169.5" cy="234" r="3.5"/><path class="mv-cross" d="M289.5,299L278.5,299"/><circle class="mv-hollow" cx="284" cy="290.5" r="3.5"/><text class="mv-label"><tspan class="mv-label-line" x="212.5" y="224">is billed by</tspan></text></g><g class="mv-edge" data-edge="PRODUCT-SUPPLIER" data-style="solid"><path class="mv-line" d="M92,72L92,120"/><path class="mv-cross" d="M92,81L86.5,72M92,81L97.5,72M86.5,84L97.5,84"/><path class="mv-cross" d="M92,111L97.5,120M92,111L86.5,120"/><circle class="mv-hollow" cx="92" cy="106.5" r="3.5"/><text class="mv-label"><tspan class="mv-label-line" x="147" y="97">is stocked by</tspan></text></g></g><g></g><g><g class="mv-node" data-node="SUPPLIER" data-kind="step"><rect class="mv-shape" x="28" y="120" width="128" height="44" rx="8"/><text><tspan x="92" y="146.5">SUPPLIER</tspan></text></g><g class="mv-node" data-node="ORDER" data-kind="step"><rect class="mv-shape" x="28" y="212" width="128" height="44" rx="8"/><text><tspan x="92" y="238.5">ORDER</tspan></text></g><g class="mv-node" data-node="ORDER_LINE" data-kind="step"><rect class="mv-shape" x="28" y="304" width="128" height="44" rx="8"/><text><tspan x="92" y="330.5">ORDER_LINE</tspan></text></g><g class="mv-node" data-node="INVOICE" data-kind="step"><rect class="mv-shape" x="220" y="304" width="128" height="44" rx="8"/><text><tspan x="284" y="330.5">INVOICE</tspan></text></g><g class="mv-node" data-node="PRODUCT" data-kind="step"><rect class="mv-shape" x="28" y="28" width="128" height="44" rx="8"/><text><tspan x="92" y="54.5">PRODUCT</tspan></text></g></g>
</svg>
