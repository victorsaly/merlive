<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 560 524" width="560" height="524" role="img" aria-label="A grid with a block arrow, a block that holds others, a space and links (from Mermaid's own guide)">
<title>A grid with a block arrow, a block that holds others, a space and links (from Mermaid's own guide)</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-terminal:#2c7d4f;--mv-kf-terminal:#e4eee8;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-k-pink:#a8327a;--mv-kf-pink:#d8a3c3;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-terminal:#009e73;--mv-kf-terminal:#0b3939;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-k-pink:#cc79a7;--mv-kf-pink:#634e66;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="terminal"] .mv-shape{fill:var(--mv-kf-terminal);stroke:var(--mv-k-terminal)}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
[data-kind="pink"] .mv-shape{fill:var(--mv-kf-pink);stroke:var(--mv-k-pink)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-point{fill:var(--mv-edge);stroke:var(--mv-edge)}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="terminal"] .mv-stripe{fill:var(--mv-k-terminal)}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-kind="pink"] .mv-stripe{fill:var(--mv-k-pink)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="560" height="524" fill="url(#mv-dots)"/><g><g class="mv-group"><rect x="28" y="228" width="504" height="84" rx="8"/></g></g><g><g class="mv-edge" data-edge="C-D" data-style="solid"><path class="mv-line" d="M456,300L456,445"/><polygon class="mv-head" points="456,452 460.5,443 451.5,443"/></g><g class="mv-edge" data-edge="C-D#2" data-style="solid"><path class="mv-line" d="M476,300L476,445"/><polygon class="mv-head" points="476,452 480.5,443 471.5,443"/></g></g><g></g><g><g class="mv-node" data-node="db" data-kind="terminal"><rect class="mv-shape mv-pill" x="28" y="28" width="504" height="44" rx="22"/><text><tspan x="280" y="54.5">DB</tspan></text></g><g class="mv-node" data-node="feeds" data-kind="step"><polygon class="mv-shape" points="241.6,120 241.6,164 216,164 280,180 344,164 318.4,164 318.4,120"/><text><tspan x="280" y="146.5"></tspan></text></g><g class="mv-node" data-node="A" data-kind="step"><rect class="mv-shape" x="40" y="240" width="128" height="60" rx="8"/><text><tspan x="104" y="274.5">A</tspan></text></g><g class="mv-node" data-node="B" data-kind="pink" data-outline="heavy"><rect class="mv-shape" x="216" y="240" width="128" height="60" rx="8"/><rect class="mv-stripe" x="217" y="248" width="4" height="44"/><text><tspan x="280" y="266.5">A wide one in</tspan><tspan x="280" y="282.5">the middle</tspan></text></g><g class="mv-node" data-node="C" data-kind="step"><rect class="mv-shape" x="392" y="240" width="128" height="60" rx="8"/><text><tspan x="456" y="274.5">C</tspan></text></g><g class="mv-node" data-node="D" data-kind="step"><rect class="mv-shape" x="28" y="452" width="504" height="44" rx="8"/><text><tspan x="280" y="478.5">D</tspan></text></g></g>
</svg>
