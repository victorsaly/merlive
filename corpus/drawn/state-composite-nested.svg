<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 218 572" width="218" height="572" role="img" aria-label="A composite state inside another">
<title>A composite state inside another</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-terminal:#2c7d4f;--mv-kf-terminal:#e4eee8;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-terminal:#009e73;--mv-kf-terminal:#0b3939;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="terminal"] .mv-shape{fill:var(--mv-kf-terminal);stroke:var(--mv-k-terminal)}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
[data-kind="terminal"] .mv-stripe{fill:var(--mv-k-terminal)}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="218" height="572" fill="url(#mv-dots)"/><g><g class="mv-group"><rect x="14" y="94" width="176" height="450" rx="8"/></g><g class="mv-group"><rect x="26" y="186" width="152" height="266" rx="8"/></g></g><g><g class="mv-edge mv-main" data-edge="start-Order_start" data-style="solid"><path class="mv-line" d="M102,72L102,113"/><polygon class="mv-head" points="102,120 106.5,111 97.5,111"/></g><g class="mv-edge mv-main" data-edge="Order_start-Open_start" data-style="solid"><path class="mv-line" d="M102,164L102,205"/><polygon class="mv-head" points="102,212 106.5,203 97.5,203"/></g><g class="mv-edge mv-main" data-edge="Open_start-Picking" data-style="solid"><path class="mv-line" d="M102,256L102,297"/><polygon class="mv-head" points="102,304 106.5,295 97.5,295"/></g><g class="mv-edge mv-main" data-edge="Picking-Packing" data-style="solid"><path class="mv-line" d="M102,348L102,389"/><polygon class="mv-head" points="102,396 106.5,387 97.5,387"/></g><g class="mv-edge mv-main" data-edge="Packing-Closed" data-style="solid"><path class="mv-line" d="M102,440L102,481"/><polygon class="mv-head" points="102,488 106.5,479 97.5,479"/></g></g><g><text class="mv-name" x="43.5" y="110">Order</text><text class="mv-name" x="51.5" y="202">Open</text></g><g><g class="mv-node" data-node="start" data-kind="terminal"><rect class="mv-shape mv-pill" x="38" y="28" width="128" height="44" rx="22"/><text><tspan x="102" y="54.5">Start</tspan></text></g><g class="mv-node" data-node="Order_start" data-kind="terminal"><rect class="mv-shape mv-pill" x="38" y="120" width="128" height="44" rx="22"/><text><tspan x="102" y="146.5">Start</tspan></text></g><g class="mv-node" data-node="Open_start" data-kind="terminal"><rect class="mv-shape mv-pill" x="38" y="212" width="128" height="44" rx="22"/><text><tspan x="102" y="238.5">Start</tspan></text></g><g class="mv-node" data-node="Picking" data-kind="step"><rect class="mv-shape" x="38" y="304" width="128" height="44" rx="8"/><text><tspan x="102" y="330.5">Picking</tspan></text></g><g class="mv-node" data-node="Packing" data-kind="step"><rect class="mv-shape" x="38" y="396" width="128" height="44" rx="8"/><text><tspan x="102" y="422.5">Packing</tspan></text></g><g class="mv-node" data-node="Closed" data-kind="step"><rect class="mv-shape" x="38" y="488" width="128" height="44" rx="8"/><text><tspan x="102" y="514.5">Closed</tspan></text></g></g>
</svg>
