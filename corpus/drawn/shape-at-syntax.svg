<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 376 440" width="376" height="440" role="img" aria-label="Shapes written as @{ shape: … }, with a label">
<title>Shapes written as @{ shape: … }, with a label</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-k-decision:#b87a00;--mv-kf-decision:#f6eede;--mv-k-data:#0a84c4;--mv-kf-data:#dfeff7;--mv-k-terminal:#2c7d4f;--mv-kf-terminal:#e4eee8;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-k-decision:#e69f00;--mv-kf-decision:#29392a;--mv-k-data:#0072b2;--mv-kf-data:#0b3341;--mv-k-terminal:#009e73;--mv-kf-terminal:#0b3939;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
[data-kind="decision"] .mv-shape{fill:var(--mv-kf-decision);stroke:var(--mv-k-decision)}
[data-kind="data"] .mv-shape{fill:var(--mv-kf-data);stroke:var(--mv-k-data)}
[data-kind="terminal"] .mv-shape{fill:var(--mv-kf-terminal);stroke:var(--mv-k-terminal)}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-kind="decision"] .mv-stripe{fill:var(--mv-k-decision)}
[data-kind="data"] .mv-stripe{fill:var(--mv-k-data)}
[data-kind="terminal"] .mv-stripe{fill:var(--mv-k-terminal)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-group text{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="376" height="440" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge mv-main" data-edge="A-B" data-style="solid"><path class="mv-line" d="M92,88L92,129"/><polygon class="mv-head" points="92,136 96.5,127 87.5,127"/></g><g class="mv-edge" data-edge="B-C" data-style="solid"><path class="mv-line" d="M156,166L276,166Q284,166 284,174L284,237"/><polygon class="mv-head" points="284,244 288.5,235 279.5,235"/></g><g class="mv-edge mv-main" data-edge="B-D" data-style="solid"><path class="mv-line" d="M92,196L92,237"/><polygon class="mv-head" points="92,244 96.5,235 87.5,235"/></g><g class="mv-edge mv-main" data-edge="D-E" data-style="solid"><path class="mv-line" d="M92,304L92,345"/><polygon class="mv-head" points="92,352 96.5,343 87.5,343"/></g></g><g><g class="mv-node" data-node="A" data-kind="step"><rect class="mv-shape" x="28" y="28" width="128" height="60" rx="8"/><text><tspan x="92" y="62.5">Take the order</tspan></text></g><g class="mv-node" data-node="B" data-kind="decision"><polygon class="mv-shape" points="50,136 134,136 156,166 134,196 50,196 28,166"/><text><tspan x="92" y="170.5">In stock?</tspan></text></g><g class="mv-node" data-node="C" data-kind="data"><rect class="mv-shape" x="220" y="244" width="128" height="60" rx="8"/><rect class="mv-stripe" x="221" y="252" width="4" height="44"/><text><tspan x="284" y="278.5">Orders</tspan></text></g><g class="mv-node" data-node="D" data-kind="step"><rect class="mv-shape" x="28" y="244" width="128" height="60" rx="8"/><text><tspan x="92" y="270.5">Back order</tspan><tspan x="92" y="286.5">note</tspan></text></g><g class="mv-node" data-node="E" data-kind="terminal"><rect class="mv-shape mv-pill" x="28" y="352" width="128" height="60" rx="30"/><text><tspan x="92" y="386.5">Done</tspan></text></g></g>
</svg>
