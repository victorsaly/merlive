<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 1144 376" width="1144" height="376" role="img" aria-label="The eight relations">
<title>The eight relations</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="1144" height="376" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge" data-edge="Document-Order" data-style="solid"><path class="mv-line" d="M668,175L668,226Q668,234 676,234L796,234"/><polygon class="mv-hollow" points="668,164 662.5,175 673.5,175"/></g><g class="mv-edge" data-edge="Order-OrderLine" data-style="solid"><path class="mv-line" d="M860,270L860,304"/><polygon class="mv-head" points="860,256 855.5,263 860,270 864.5,263"/></g><g class="mv-edge" data-edge="Warehouse-Product" data-style="solid"><path class="mv-line" d="M668,86L668,88Q668,90 666,90L494,90Q486,90 486,98L486,120"/><polygon class="mv-hollow" points="668,72 663.5,79 668,86 672.5,79"/></g><g class="mv-edge" data-edge="Invoice-Order" data-style="solid"><path class="mv-line" d="M860,164L860,205"/><polygon class="mv-head" points="860,212 864.5,203 855.5,203"/></g><g class="mv-edge" data-edge="Supplier-Contact" data-style="solid"><path class="mv-line" d="M476,72L476,94Q476,102 468,102L292,102Q284,102 284,110L284,120"/></g><g class="mv-edge" data-edge="Order-PriceList" data-style="dotted"><path class="mv-line" d="M924,234L1044,234Q1052,234 1052,242L1052,297"/><polygon class="mv-head" points="1052,304 1056.5,295 1047.5,295"/></g><g class="mv-edge" data-edge="Payable-Invoice" data-style="dotted"><path class="mv-line" d="M860,83L860,120"/><polygon class="mv-hollow" points="860,72 854.5,83 865.5,83"/></g><g class="mv-edge" data-edge="Buyer-Note" data-style="dotted"><path class="mv-line" d="M284,72L284,82Q284,90 276,90L100,90Q92,90 92,98L92,120"/></g></g><g></g><g><g class="mv-node" data-node="Document" data-kind="step"><rect class="mv-shape" x="604" y="120" width="128" height="44" rx="8"/><text><tspan x="668" y="146.5">Document</tspan></text></g><g class="mv-node" data-node="Order" data-kind="step"><rect class="mv-shape" x="796" y="212" width="128" height="44" rx="8"/><text><tspan x="860" y="238.5">Order</tspan></text></g><g class="mv-node" data-node="OrderLine" data-kind="step"><rect class="mv-shape" x="796" y="304" width="128" height="44" rx="8"/><text><tspan x="860" y="330.5">OrderLine</tspan></text></g><g class="mv-node" data-node="Warehouse" data-kind="step"><rect class="mv-shape" x="604" y="28" width="128" height="44" rx="8"/><text><tspan x="668" y="54.5">Warehouse</tspan></text></g><g class="mv-node" data-node="Product" data-kind="step"><rect class="mv-shape" x="412" y="120" width="128" height="44" rx="8"/><text><tspan x="476" y="146.5">Product</tspan></text></g><g class="mv-node" data-node="Invoice" data-kind="step"><rect class="mv-shape" x="796" y="120" width="128" height="44" rx="8"/><text><tspan x="860" y="146.5">Invoice</tspan></text></g><g class="mv-node" data-node="Supplier" data-kind="step"><rect class="mv-shape" x="412" y="28" width="128" height="44" rx="8"/><text><tspan x="476" y="54.5">Supplier</tspan></text></g><g class="mv-node" data-node="Contact" data-kind="step"><rect class="mv-shape" x="220" y="120" width="128" height="44" rx="8"/><text><tspan x="284" y="146.5">Contact</tspan></text></g><g class="mv-node" data-node="PriceList" data-kind="step"><rect class="mv-shape" x="988" y="304" width="128" height="44" rx="8"/><text><tspan x="1052" y="330.5">PriceList</tspan></text></g><g class="mv-node" data-node="Payable" data-kind="step"><rect class="mv-shape" x="796" y="28" width="128" height="44" rx="8"/><text><tspan x="860" y="54.5">Payable</tspan></text></g><g class="mv-node" data-node="Buyer" data-kind="step"><rect class="mv-shape" x="220" y="28" width="128" height="44" rx="8"/><text><tspan x="284" y="54.5">Buyer</tspan></text></g><g class="mv-node" data-node="Note" data-kind="step"><rect class="mv-shape" x="28" y="120" width="128" height="44" rx="8"/><text><tspan x="92" y="146.5">Note</tspan></text></g></g>
</svg>
