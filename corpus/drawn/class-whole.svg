<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 440 336" width="440" height="336" role="img" aria-label="A whole diagram: classes, what they list, what they inherit, and a note">
<title>A whole diagram: classes, what they list, what they inherit, and a note</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="440" height="336" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge" data-edge="Document-Order" data-style="solid"><path class="mv-line" d="M108,155L108,192"/><polygon class="mv-hollow" points="108,144 102.5,155 113.5,155"/></g><g class="mv-edge" data-edge="Document-Invoice" data-style="solid"><path class="mv-line" d="M199,86L324,86Q332,86 332,94L332,200"/><polygon class="mv-hollow" points="188,86 199,91.5 199,80.5"/></g></g><g></g><g><g class="mv-node" data-node="Document" data-kind="step"><rect class="mv-shape" x="28" y="28" width="160" height="116" rx="8"/><text><tspan x="108" y="54.5">Document</tspan></text><path class="mv-shape mv-detail" d="M28,72H188"/><text class="mv-rows" xml:space="preserve"><tspan class="mv-row" x="40" y="90">+String number</tspan><tspan class="mv-row" x="40" y="106">+Date raised</tspan></text><path class="mv-shape mv-detail" d="M28,116H188"/><text class="mv-rows" xml:space="preserve"><tspan class="mv-row" x="40" y="134">+print()</tspan></text></g><g class="mv-node" data-node="Order" data-kind="step"><rect class="mv-shape" x="28" y="192" width="160" height="116" rx="8"/><text><tspan x="108" y="218.5">Order</tspan></text><path class="mv-shape mv-detail" d="M28,236H188"/><text class="mv-rows" xml:space="preserve"><tspan class="mv-row" x="40" y="254">+String buyer</tspan></text><path class="mv-shape mv-detail" d="M28,264H188"/><text class="mv-rows" xml:space="preserve"><tspan class="mv-row" x="40" y="282">+approve()</tspan><tspan class="mv-row" x="40" y="298">+total() Money</tspan></text></g><g class="mv-node" data-node="Invoice" data-kind="step"><rect class="mv-shape" x="252" y="200" width="160" height="100" rx="8"/><text><tspan x="332" y="226.5">Invoice</tspan></text><path class="mv-shape mv-detail" d="M252,244H412"/><text class="mv-rows" xml:space="preserve"><tspan class="mv-row" x="264" y="262">-Money amountDue</tspan></text><path class="mv-shape mv-detail" d="M252,272H412"/><text class="mv-rows" xml:space="preserve"><tspan class="mv-row" x="264" y="290">-pay()</tspan></text></g></g>
</svg>
