<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 1592 230" width="1592" height="230" role="img" aria-label="Nine periods: a timeline as long as it was written">
<title>Nine periods: a timeline as long as it was written</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-period:#b3cbc7;--mv-kf-period:#ffffff;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-period:#2b5560;--mv-kf-period:#0d2a30;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="period"] .mv-shape{fill:var(--mv-kf-period);stroke:var(--mv-k-period)}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-point{fill:var(--mv-edge);stroke:var(--mv-edge)}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="period"] .mv-stripe{fill:var(--mv-k-period)}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<text class="mv-title"><tspan class="mv-title-line" x="796" y="33">A year of orders</tspan></text>
<g transform="translate(0,38)">
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="1592" height="192" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge" data-edge="period1-event1_1" data-style="dotted"><path class="mv-line" d="M92,72L92,120"/></g><g class="mv-edge" data-edge="period1-period2" data-style="solid"><path class="mv-line" d="M156,50L197,50"/><polygon class="mv-head" points="204,50 195,45.5 195,54.5"/></g><g class="mv-edge" data-edge="period2-event2_1" data-style="dotted"><path class="mv-line" d="M268,72L268,120"/></g><g class="mv-edge" data-edge="period2-period3" data-style="solid"><path class="mv-line" d="M332,50L373,50"/><polygon class="mv-head" points="380,50 371,45.5 371,54.5"/></g><g class="mv-edge" data-edge="period3-event3_1" data-style="dotted"><path class="mv-line" d="M444,72L444,120"/></g><g class="mv-edge" data-edge="period3-period4" data-style="solid"><path class="mv-line" d="M508,50L549,50"/><polygon class="mv-head" points="556,50 547,45.5 547,54.5"/></g><g class="mv-edge" data-edge="period4-event4_1" data-style="dotted"><path class="mv-line" d="M620,72L620,120"/></g><g class="mv-edge" data-edge="period4-period5" data-style="solid"><path class="mv-line" d="M684,50L725,50"/><polygon class="mv-head" points="732,50 723,45.5 723,54.5"/></g><g class="mv-edge" data-edge="period5-event5_1" data-style="dotted"><path class="mv-line" d="M796,72L796,120"/></g><g class="mv-edge" data-edge="period5-period6" data-style="solid"><path class="mv-line" d="M860,50L901,50"/><polygon class="mv-head" points="908,50 899,45.5 899,54.5"/></g><g class="mv-edge" data-edge="period6-event6_1" data-style="dotted"><path class="mv-line" d="M972,72L972,120"/></g><g class="mv-edge" data-edge="period6-period7" data-style="solid"><path class="mv-line" d="M1036,50L1077,50"/><polygon class="mv-head" points="1084,50 1075,45.5 1075,54.5"/></g><g class="mv-edge" data-edge="period7-event7_1" data-style="dotted"><path class="mv-line" d="M1148,72L1148,120"/></g><g class="mv-edge" data-edge="period7-period8" data-style="solid"><path class="mv-line" d="M1212,50L1253,50"/><polygon class="mv-head" points="1260,50 1251,45.5 1251,54.5"/></g><g class="mv-edge" data-edge="period8-event8_1" data-style="dotted"><path class="mv-line" d="M1324,72L1324,120"/></g><g class="mv-edge" data-edge="period8-period9" data-style="solid"><path class="mv-line" d="M1388,50L1429,50"/><polygon class="mv-head" points="1436,50 1427,45.5 1427,54.5"/></g><g class="mv-edge" data-edge="period9-event9_1" data-style="dotted"><path class="mv-line" d="M1500,72L1500,120"/></g></g><g></g><g><g class="mv-node" data-node="period1" data-kind="period" data-outline="heavy"><rect class="mv-shape" x="28" y="28" width="128" height="44" rx="8"/><rect class="mv-stripe" x="29" y="36" width="4" height="28"/><text><tspan x="92" y="54.5">January</tspan></text></g><g class="mv-node" data-node="event1_1" data-kind="step"><rect class="mv-shape" x="28" y="120" width="128" height="44" rx="8"/><text><tspan x="92" y="146.5">Budget set</tspan></text></g><g class="mv-node" data-node="period2" data-kind="period" data-outline="heavy"><rect class="mv-shape" x="204" y="28" width="128" height="44" rx="8"/><rect class="mv-stripe" x="205" y="36" width="4" height="28"/><text><tspan x="268" y="54.5">February</tspan></text></g><g class="mv-node" data-node="event2_1" data-kind="step"><rect class="mv-shape" x="204" y="120" width="128" height="44" rx="8"/><text><tspan x="268" y="146.5">Raised</tspan></text></g><g class="mv-node" data-node="period3" data-kind="period" data-outline="heavy"><rect class="mv-shape" x="380" y="28" width="128" height="44" rx="8"/><rect class="mv-stripe" x="381" y="36" width="4" height="28"/><text><tspan x="444" y="54.5">March</tspan></text></g><g class="mv-node" data-node="event3_1" data-kind="step"><rect class="mv-shape" x="380" y="120" width="128" height="44" rx="8"/><text><tspan x="444" y="146.5">Approved</tspan></text></g><g class="mv-node" data-node="period4" data-kind="period" data-outline="heavy"><rect class="mv-shape" x="556" y="28" width="128" height="44" rx="8"/><rect class="mv-stripe" x="557" y="36" width="4" height="28"/><text><tspan x="620" y="54.5">April</tspan></text></g><g class="mv-node" data-node="event4_1" data-kind="step"><rect class="mv-shape" x="556" y="120" width="128" height="44" rx="8"/><text><tspan x="620" y="146.5">Sent</tspan></text></g><g class="mv-node" data-node="period5" data-kind="period" data-outline="heavy"><rect class="mv-shape" x="732" y="28" width="128" height="44" rx="8"/><rect class="mv-stripe" x="733" y="36" width="4" height="28"/><text><tspan x="796" y="54.5">May</tspan></text></g><g class="mv-node" data-node="event5_1" data-kind="step"><rect class="mv-shape" x="732" y="120" width="128" height="44" rx="8"/><text><tspan x="796" y="146.5">Chased</tspan></text></g><g class="mv-node" data-node="period6" data-kind="period" data-outline="heavy"><rect class="mv-shape" x="908" y="28" width="128" height="44" rx="8"/><rect class="mv-stripe" x="909" y="36" width="4" height="28"/><text><tspan x="972" y="54.5">June</tspan></text></g><g class="mv-node" data-node="event6_1" data-kind="step"><rect class="mv-shape" x="908" y="120" width="128" height="44" rx="8"/><text><tspan x="972" y="146.5">Delivered</tspan></text></g><g class="mv-node" data-node="period7" data-kind="period" data-outline="heavy"><rect class="mv-shape" x="1084" y="28" width="128" height="44" rx="8"/><rect class="mv-stripe" x="1085" y="36" width="4" height="28"/><text><tspan x="1148" y="54.5">July</tspan></text></g><g class="mv-node" data-node="event7_1" data-kind="step"><rect class="mv-shape" x="1084" y="120" width="128" height="44" rx="8"/><text><tspan x="1148" y="146.5">Checked</tspan></text></g><g class="mv-node" data-node="period8" data-kind="period" data-outline="heavy"><rect class="mv-shape" x="1260" y="28" width="128" height="44" rx="8"/><rect class="mv-stripe" x="1261" y="36" width="4" height="28"/><text><tspan x="1324" y="54.5">August</tspan></text></g><g class="mv-node" data-node="event8_1" data-kind="step"><rect class="mv-shape" x="1260" y="120" width="128" height="44" rx="8"/><text><tspan x="1324" y="146.5">Invoiced</tspan></text></g><g class="mv-node" data-node="period9" data-kind="period" data-outline="heavy"><rect class="mv-shape" x="1436" y="28" width="128" height="44" rx="8"/><rect class="mv-stripe" x="1437" y="36" width="4" height="28"/><text><tspan x="1500" y="54.5">September</tspan></text></g><g class="mv-node" data-node="event9_1" data-kind="step"><rect class="mv-shape" x="1436" y="120" width="128" height="44" rx="8"/><text><tspan x="1500" y="146.5">Paid</tspan></text></g></g>
</g>
</svg>
