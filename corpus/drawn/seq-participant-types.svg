op</tspan></text></g><g class="mv-node" data-node="Rules" data-kind="step" data-mark="control"><circle class="mv-shape" cx="220" cy="45" r="12"/><path class="mv-mark" d="M225,29L219,33L225,38"/><text><tspan x="220" y="74.5">Rules</tspan></text></g><g class="mv-node" data-node="Order" data-kind="step" data-mark="entity"><circle class="mv-shape" cx="364" cy="41" r="12"/><path class="mv-mark" d="M352,55H376"/><text><tspan x="364" y="74.5">Order</tspan></text></g><g class="mv-node" data-node="Orders" data-kind="data" data-mark="database"><path class="mv-shape" d="M495,33.5A13,4.5 0 0 1 521,33.5V52.5A13,4.5 0 0 1 495,52.5Z"/><path class="mv-mark" d="M495,33.5A13,4.5 0 0 0 521,33.5"/><text><tspan x="508" y="74.5">Orders</tspan></text></g><g class="mv-node" data-node="Lines" data-kind="step"><rect class="mv-shape" x="609" y="28" width="91" height="49" rx="4"/><rect class="mv-shape" x="604" y="33" width="91" height="49" rx="4"/><text><tspan x="649.5" y="62">Lines</tspan></text></g><g class="mv-node" data-node="Jobs" data-kind="step"><path class="mv-shape" d="M756,28H836A8,27 0 0 1 836,82H756A8,27 0 0 1 756,28Z"/><path class="mv-shape mv-detail" d="M836,28A8,27 0 0 0 836,82"/><text><tspan x="792" y="59.5">Jobs</tspan></text></g><g class="mv-node" data-node="Shop" data-kind="step" data-mark="boundary"><circle class="mv-shape" cx="76" cy="342" r="12"/><path class="mv-mark" d="M64,342H53M53,331V353"/><text><tspan x="76" y="375.5">Shop</tspan></text></g><g class="mv-node" data-node="Rules" data-kind="step" data-mark="control"><circle class="mv-shape" cx="220" cy="346" r="12"/><path class="mv-mark" d="M225,330L219,334L225,339"/><text><tspan x="220" y="375.5">Rules</tspan></text></g><g class="mv-node" data-node="Order" data-kind="step" data-mark="entity"><circle class="mv-shape" cx="364" cy="342" r="12"/><path class="mv-mark" d="M352,356H376"/><text><tspan x="364" y="375.5">Order</tspan></text></g><g class="mv-node" data-node="Orders" data-kind="data" data-mark="database"><path class="mv-shape" d="M495,334.5A13,4.5 0 0 1 521,334.5V353.5A13,4.5 0 0 1 495,353.5Z"/><path class="mv-mark" d="M495,334.5A13,4.5 0 0 0 521,334.5"/><text><tspan x="508" y="375.5">Orders</tspan></text></g><g class="mv-node" data-node="Lines" data-kind="step"><rect class="mv-shape" x="609" y="329" width="91" height="49" rx="4"/><rect class="mv-shape" x="604" y="334" width="91" height="49" rx="4"/><text><tspan x="649.5" y="363">Lines</tspan></text></g><g class="mv-node" data-node="Jobs" data-kind="step"><path class="mv-shape" d="M756,329H836A8,27 0 0 1 836,383H756A8,27 0 0 1 756,329Z"/><path class="mv-shape mv-detail" d="M836,329A8,27 0 0 0 836,383"/><text><tspan x="792" y="360.5">Jobs</tspan></text></g></g>
</svg>
