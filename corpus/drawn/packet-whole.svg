<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 2408 670" width="2408" height="670" role="img" aria-label="A whole header: a title, fields from one bit to two rows, thirty-two columns">
<title>A whole header: a title, fields from one bit to two rows, thirty-two columns</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-point{fill:var(--mv-edge);stroke:var(--mv-edge)}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<text class="mv-title"><tspan class="mv-title-line" x="1204" y="33">TCP Packet</tspan></text>
<g transform="translate(0,38)">
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="2408" height="632" fill="url(#mv-dots)"/><g></g><g></g><g></g><g><g class="mv-node" data-node="bits0" data-kind="step"><rect class="mv-shape" x="28" y="28" width="1168" height="58" rx="8"/><text class="mv-over" x="612" y="46">0–15</text><text><tspan x="612" y="68.5">Source Port</tspan></text></g><g class="mv-node" data-node="bits16" data-kind="step"><rect class="mv-shape" x="1212" y="28" width="1168" height="58" rx="8"/><text class="mv-over" x="1796" y="46">16–31</text><text><tspan x="1796" y="68.5">Destination Port</tspan></text></g><g class="mv-node" data-node="bits32" data-kind="step"><rect class="mv-shape" x="28" y="102" width="2352" height="58" rx="8"/><text class="mv-over" x="1204" y="120">32–63</text><text><tspan x="1204" y="142.5">Sequence Number</tspan></text></g><g class="mv-node" data-node="bits64" data-kind="step"><rect class="mv-shape" x="28" y="176" width="2352" height="58" rx="8"/><text class="mv-over" x="1204" y="194">64–95</text><text><tspan x="1204" y="216.5">Acknowledgment Number</tspan></text></g><g class="mv-node" data-node="bits96" data-kind="step"><rect class="mv-shape" x="28" y="250" width="280" height="58" rx="8"/><text class="mv-over" x="168" y="268">96–99</text><text><tspan x="168" y="290.5">Data Offset</tspan></text></g><g class="mv-node" data-node="bits100" data-kind="step"><rect class="mv-shape" x="324" y="250" width="428" height="58" rx="8"/><text class="mv-over" x="538" y="268">100–105</text><text><tspan x="538" y="290.5">Reserved</tspan></text></g><g class="mv-node" data-node="bits106" data-kind="step"><rect class="mv-shape" x="768" y="250" width="58" height="58" rx="8"/><text class="mv-over" x="797" y="268">106</text><text><tspan x="797" y="290.5">URG</tspan></text></g><g class="mv-node" data-node="bits107" data-kind="step"><rect class="mv-shape" x="842" y="250" width="58" height="58" rx="8"/><text class="mv-over" x="871" y="268">107</text><text><tspan x="871" y="290.5">ACK</tspan></text></g><g class="mv-node" data-node="bits108" data-kind="step"><rect class="mv-shape" x="916" y="250" width="58" height="58" rx="8"/><text class="mv-over" x="945" y="268">108</text><text><tspan x="945" y="290.5">PSH</tspan></text></g><g class="mv-node" data-node="bits109" data-kind="step"><rect class="mv-shape" x="990" y="250" width="58" height="58" rx="8"/><text class="mv-over" x="1019" y="268">109</text><text><tspan x="1019" y="290.5">RST</tspan></text></g><g class="mv-node" data-node="bits110" data-kind="step"><rect class="mv-shape" x="1064" y="250" width="58" height="58" rx="8"/><text class="mv-over" x="1093" y="268">110</text><text><tspan x="1093" y="290.5">SYN</tspan></text></g><g class="mv-node" data-node="bits111" data-kind="step"><rect class="mv-shape" x="1138" y="250" width="58" height="58" rx="8"/><text class="mv-over" x="1167" y="268">111</text><text><tspan x="1167" y="290.5">FIN</tspan></text></g><g class="mv-node" data-node="bits112" data-kind="step"><rect class="mv-shape" x="1212" y="250" width="1168" height="58" rx="8"/><text class="mv-over" x="1796" y="268">112–127</text><text><tspan x="1796" y="290.5">Window</tspan></text></g><g class="mv-node" data-node="bits128" data-kind="step"><rect class="mv-shape" x="28" y="324" width="1168" height="58" rx="8"/><text class="mv-over" x="612" y="342">128–143</text><text><tspan x="612" y="364.5">Checksum</tspan></text></g><g class="mv-node" data-node="bits144" data-kind="step"><rect class="mv-shape" x="1212" y="324" width="1168" height="58" rx="8"/><text class="mv-over" x="1796" y="342">144–159</text><text><tspan x="1796" y="364.5">Urgent Pointer</tspan></text></g><g class="mv-node" data-node="bits160" data-kind="step"><rect class="mv-shape" x="28" y="398" width="2352" height="58" rx="8"/><text class="mv-over" x="1204" y="416">160–191</text><text><tspan x="1204" y="438.5">(Options and Padding)</tspan></text></g><g class="mv-node" data-node="bits192" data-kind="step"><rect class="mv-shape" x="28" y="472" width="2352" height="58" rx="8"/><text class="mv-over" x="1204" y="490">192–223</text><text><tspan x="1204" y="512.5">Data (variable length)</tspan></text></g><g class="mv-node" data-node="bits224" data-kind="step"><rect class="mv-shape" x="28" y="546" width="2352" height="58" rx="8"/><text class="mv-over" x="1204" y="564">224–255</text><text><tspan x="1204" y="586.5">Data (variable length)</tspan></text></g></g>
</g>
</svg>
