<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 668 722" width="668" height="722" role="img" aria-label="A whole timeline: a title, three sections, periods with none, one and two events, a line break">
<title>A whole timeline: a title, three sections, periods with none, one and two events, a line break</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-period:#b3cbc7;--mv-kf-period:#ffffff;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-period:#2b5560;--mv-kf-period:#0d2a30;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="period"] .mv-shape{fill:var(--mv-kf-period);stroke:var(--mv-k-period)}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-point{fill:var(--mv-edge);stroke:var(--mv-edge)}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="period"] .mv-stripe{fill:var(--mv-k-period)}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<text class="mv-title"><tspan class="mv-title-line" x="334" y="33">From order to invoice</tspan></text>
<g transform="translate(0,38)">
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="668" height="684" fill="url(#mv-dots)"/><g><g class="mv-group"><rect x="28" y="28" width="392" height="298" rx="8"/></g><g class="mv-group"><rect x="468" y="28" width="172" height="298" rx="8"/></g><g class="mv-group"><rect x="28" y="374" width="392" height="282" rx="8"/></g></g><g><g class="mv-edge" data-edge="period1-event1_1" data-style="dotted"><path class="mv-line" d="M120,98L120,146"/></g><g class="mv-edge" data-edge="event1_1-event1_2" data-style="dotted"><path class="mv-line" d="M120,206L120,254"/></g><g class="mv-edge" data-edge="period1-period2" data-style="solid"><path class="mv-line" d="M200,76L241,76"/><polygon class="mv-head" points="248,76 239,71.5 239,80.5"/></g><g class="mv-edge" data-edge="period2-event2_1" data-style="dotted"><path class="mv-line" d="M328,98L328,146"/></g><g class="mv-edge" data-edge="event2_1-event2_2" data-style="dotted"><path class="mv-line" d="M328,206L328,254"/></g><g class="mv-edge" data-edge="period2-period3" data-style="solid"><path class="mv-line" d="M408,76L473,76"/><polygon class="mv-head" points="480,76 471,71.5 471,80.5"/></g><g class="mv-edge" data-edge="period3-period4" data-style="solid"><path class="mv-line" d="M554,98L554,342Q554,350 546,350L128,350Q120,350 120,358L120,393"/><polygon class="mv-head" points="120,400 124.5,391 115.5,391"/></g><g class="mv-edge" data-edge="period4-event4_1" data-style="dotted"><path class="mv-line" d="M120,444L120,492"/></g><g class="mv-edge" data-edge="period4-period5" data-style="solid"><path class="mv-line" d="M200,422L241,422"/><polygon class="mv-head" points="248,422 239,417.5 239,426.5"/></g><g class="mv-edge" data-edge="period5-event5_1" data-style="dotted"><path class="mv-line" d="M328,444L328,492"/></g><g class="mv-edge" data-edge="event5_1-event5_2" data-style="dotted"><path class="mv-line" d="M328,552L328,600"/></g></g><g><text class="mv-name" x="61.5" y="44">Buying</text><text class="mv-name" x="505.5" y="44">Waiting</text><text class="mv-name" x="69" y="390">Delivery</text></g><g><g class="mv-node" data-node="period1" data-kind="period" data-outline="heavy"><rect class="mv-shape" x="40" y="54" width="160" height="44" rx="8"/><rect class="mv-stripe" x="41" y="62" width="4" height="28"/><text><tspan x="120" y="80.5">Monday</tspan></text></g><g class="mv-node" data-node="event1_1" data-kind="step"><rect class="mv-shape" x="40" y="146" width="160" height="60" rx="8"/><text><tspan x="120" y="172.5">Raised</tspan><tspan x="120" y="188.5">by the buyer</tspan></text></g><g class="mv-node" data-node="event1_2" data-kind="step"><rect class="mv-shape" x="40" y="254" width="160" height="60" rx="8"/><text><tspan x="120" y="280.5">Checked against</tspan><tspan x="120" y="296.5">the budget</tspan></text></g><g class="mv-node" data-node="period2" data-kind="period" data-outline="heavy"><rect class="mv-shape" x="248" y="54" width="160" height="44" rx="8"/><rect class="mv-stripe" x="249" y="62" width="4" height="28"/><text><tspan x="328" y="80.5">Tuesday</tspan></text></g><g class="mv-node" data-node="event2_1" data-kind="step"><rect class="mv-shape" x="248" y="146" width="160" height="60" rx="8"/><text><tspan x="328" y="180.5">Approved</tspan></text></g><g class="mv-node" data-node="event2_2" data-kind="step"><rect class="mv-shape" x="248" y="254" width="160" height="60" rx="8"/><text><tspan x="328" y="280.5">Sent to the</tspan><tspan x="328" y="296.5">supplier</tspan></text></g><g class="mv-node" data-node="period3" data-kind="period" data-outline="heavy"><rect class="mv-shape" x="480" y="54" width="148" height="44" rx="8"/><rect class="mv-stripe" x="481" y="62" width="4" height="28"/><text><tspan x="554" y="80.5">Wednesday</tspan></text></g><g class="mv-node" data-node="period4" data-kind="period" data-outline="heavy"><rect class="mv-shape" x="40" y="400" width="160" height="44" rx="8"/><rect class="mv-stripe" x="41" y="408" width="4" height="28"/><text><tspan x="120" y="426.5">Friday</tspan></text></g><g class="mv-node" data-node="event4_1" data-kind="step"><rect class="mv-shape" x="40" y="492" width="160" height="60" rx="8"/><text><tspan x="120" y="518.5">Delivered to the</tspan><tspan x="120" y="534.5">warehouse</tspan></text></g><g class="mv-node" data-node="period5" data-kind="period" data-outline="heavy"><rect class="mv-shape" x="248" y="400" width="160" height="44" rx="8"/><rect class="mv-stripe" x="249" y="408" width="4" height="28"/><text><tspan x="328" y="426.5">Next Monday</tspan></text></g><g class="mv-node" data-node="event5_1" data-kind="step"><rect class="mv-shape" x="248" y="492" width="160" height="60" rx="8"/><text><tspan x="328" y="526.5">Invoiced</tspan></text></g><g class="mv-node" data-node="event5_2" data-kind="step"><rect class="mv-shape" x="248" y="600" width="160" height="44" rx="8"/><text><tspan x="328" y="626.5">Paid</tspan></text></g></g>
</g>
</svg>
