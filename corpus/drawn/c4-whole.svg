<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 964 636" width="964" height="636" role="img" aria-label="A whole diagram: people, a boundary of containers, a database, a queue and a system outside">
<title>A whole diagram: people, a boundary of containers, a database, a queue and a system outside</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-k-external:#5a4fcf;--mv-kf-external:#eae8f9;--mv-k-data:#0a84c4;--mv-kf-data:#dfeff7;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-k-external:#56b4e9;--mv-kf-external:#163c48;--mv-k-data:#0072b2;--mv-kf-data:#0b3341;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
[data-kind="external"] .mv-shape{fill:var(--mv-kf-external);stroke:var(--mv-k-external)}
[data-kind="data"] .mv-shape{fill:var(--mv-kf-data);stroke:var(--mv-k-data)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-point{fill:var(--mv-edge);stroke:var(--mv-edge)}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-kind="external"] .mv-stripe{fill:var(--mv-k-external)}
[data-kind="data"] .mv-stripe{fill:var(--mv-k-data)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<text class="mv-title"><tspan class="mv-title-line" x="482" y="33">Ordering: who uses it and what it is made of</tspan></text>
<g transform="translate(0,38)">
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="964" height="598" fill="url(#mv-dots)"/><g><g class="mv-group"><rect x="336" y="147" width="600" height="423" rx="8"/></g></g><g><g class="mv-edge" data-edge="buyer-web" data-style="solid"><path class="mv-line" d="M476,113L476,166"/><polygon class="mv-head" points="476,173 480.5,164 471.5,164"/><text class="mv-label"><tspan class="mv-label-line" x="567" y="138">Raises orders in [HTTPS]</tspan></text></g><g class="mv-edge" data-edge="web-api" data-style="solid"><path class="mv-line" d="M476,258L476,299"/><polygon class="mv-head" points="476,306 480.5,297 471.5,297"/><text class="mv-label"><tspan class="mv-label-line" x="564" y="283">Calls [JSON over HTTPS]</tspan></text></g><g class="mv-edge" data-edge="api-db" data-style="solid"><path class="mv-line" d="M476,391L476,466"/><polygon class="mv-head" points="476,473 480.5,464 471.5,464"/><text class="mv-label"><tspan class="mv-label-line" x="541" y="416">Reads and writes</tspan></text></g><g class="mv-edge" data-edge="api-bus" data-style="solid"><path class="mv-line" d="M604,348.5L788,348.5Q796,348.5 796,356.5L796,466"/><polygon class="mv-head" points="796,473 800.5,464 791.5,464"/><text class="mv-label"><tspan class="mv-label-line" x="660.5" y="338.5">Publishes to</tspan></text></g><g class="mv-edge" data-edge="api-portal" data-style="solid"><path class="mv-line" d="M456,398L456,424Q456,432 448,432L184,432Q176,432 176,440L176,466"/><polygon class="mv-head" points="456,391 451.5,400 460.5,400"/><polygon class="mv-head" points="176,473 180.5,464 171.5,464"/><text class="mv-label"><tspan class="mv-label-line" x="388" y="408.5">Trades orders and</tspan><tspan class="mv-label-line" x="388" y="422.5">answers with</tspan></text></g><g class="mv-edge" data-edge="rep-portal" data-style="solid"><path class="mv-line" d="M156,391L156,466"/><polygon class="mv-head" points="156,473 160.5,464 151.5,464"/><text class="mv-label"><tspan class="mv-label-line" x="224" y="416">Answers orders in</tspan></text></g></g><g><text class="mv-name" x="377" y="163">Ordering</text></g><g><g class="mv-node" data-node="buyer" data-kind="step"><rect class="mv-shape" x="348" y="28" width="256" height="85" rx="8"/><path class="mv-icon" transform="translate(447.3,56)" d="M5.3 5.2A2.7 2.7 0 1 0 10.7 5.2A2.7 2.7 0 1 0 5.3 5.2M2.8 14C2.8 11.3 5 9.9 8 9.9C11 9.9 13.2 11.3 13.2 14"/><text class="mv-over" x="476" y="46">«person»</text><text><tspan x="487" y="68.5">Buyer</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="476" y="92">Raises and chases purchase orders</tspan></text></g><g class="mv-node" data-node="rep" data-kind="external"><rect class="mv-shape" x="28" y="306" width="256" height="85" rx="8"/><rect class="mv-stripe" x="29" y="314" width="4" height="69"/><path class="mv-icon" transform="translate(113.1,334)" d="M5.3 5.2A2.7 2.7 0 1 0 10.7 5.2A2.7 2.7 0 1 0 5.3 5.2M2.8 14C2.8 11.3 5 9.9 8 9.9C11 9.9 13.2 11.3 13.2 14"/><text class="mv-over" x="156" y="324">«external person»</text><text><tspan x="167" y="346.5">Sales rep</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="156" y="370">Answers for the supplier</tspan></text></g><g class="mv-node" data-node="web" data-kind="step"><rect class="mv-shape" x="348" y="173" width="256" height="85" rx="8"/><text class="mv-over" x="476" y="191">«container: React»</text><text><tspan x="476" y="213.5">Web shop</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="476" y="237">Where orders are raised</tspan></text></g><g class="mv-node" data-node="api" data-kind="step"><rect class="mv-shape" x="348" y="306" width="256" height="85" rx="8"/><text class="mv-over" x="476" y="324">«container: C#, ASP.NET»</text><text><tspan x="476" y="346.5">Order API</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="476" y="370">Checks and saves orders</tspan></text></g><g class="mv-node" data-node="db" data-kind="data"><path class="mv-shape" d="M348,480A128,7 0 0 1 604,480V551A128,7 0 0 1 348,551Z"/><path class="mv-shape mv-detail" d="M348,480A128,7 0 0 0 604,480"/><text class="mv-over" x="476" y="498">«container database: SQL Server»</text><text><tspan x="476" y="524">Orders</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="476" y="544">Every order and its lines</tspan></text></g><g class="mv-node" data-node="bus" data-kind="data"><rect class="mv-shape mv-pill" x="668" y="473" width="256" height="85" rx="30"/><text class="mv-over" x="796" y="491">«container queue: Azure Service Bus»</text><text><tspan x="796" y="513.5">Order events</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="796" y="537">What happened, for the rest to hear</tspan></text></g><g class="mv-node" data-node="portal" data-kind="external"><rect class="mv-shape" x="28" y="473" width="256" height="85" rx="8"/><rect class="mv-stripe" x="29" y="481" width="4" height="69"/><text class="mv-over" x="156" y="491">«external system»</text><text><tspan x="156" y="513.5">Supplier portal</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="156" y="537">Takes orders from firms</tspan></text></g></g>
</g>
</svg>
