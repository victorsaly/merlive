<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-orange:#b3cbc7;--mv-kf-orange:#ffffff;--mv-k-red:#b3cbc7;--mv-kf-red:#ffffff;--mv-k-pink:#b3cbc7;--mv-kf-pink:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-orange:#2b5560;--mv-kf-orange:#0d2a30;--mv-k-red:#2b5560;--mv-kf-red:#0d2a30;--mv-k-pink:#2b5560;--mv-kf-pink:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
