<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 184 608" width="184" height="608" role="img" aria-label="flow-small.mmd">
<title>flow-small.mmd</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-blue:#0a84c4;--mv-kf-blue:#dfeff7;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-blue:#0072b2;--mv-kf-blue:#0b3341;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="blue"] .mv-shape{fill:var(--mv-kf-blue);stroke:var(--mv-k-blue)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-point{fill:var(--mv-edge);stroke:var(--mv-edge)}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="blue"] .mv-stripe{fill:var(--mv-k-blue)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="184" height="608" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge mv-main" data-edge="A1-A2" data-style="solid"><path class="mv-line" d="M92,130L92,171"/><polygon class="mv-head" points="92,178 96.5,169 87.5,169"/></g><g class="mv-edge mv-main" data-edge="A2-A3" data-style="solid"><path class="mv-line" d="M92,280L92,321"/><polygon class="mv-head" points="92,328 96.5,319 87.5,319"/></g><g class="mv-edge mv-main" data-edge="A3-A4" data-style="solid"><path class="mv-line" d="M92,430L92,471"/><polygon class="mv-head" points="92,478 96.5,469 87.5,469"/></g></g><g></g><g><g class="mv-node" data-node="A1" data-kind="blue"><rect class="mv-shape" x="28" y="28" width="128" height="102" rx="8"/><rect class="mv-stripe" x="29" y="36" width="4" height="86"/><text><tspan x="92" y="54.5">🔍 AI Security</tspan><tspan x="92" y="70.5">Scan</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="92" y="94">Automated</tspan><tspan class="mv-told-line" x="92" y="109">codebase review</tspan></text></g><g class="mv-node" data-node="A2" data-kind="blue"><rect class="mv-shape" x="28" y="178" width="128" height="102" rx="8"/><rect class="mv-stripe" x="29" y="186" width="4" height="86"/><text><tspan x="92" y="204.5">📚 Educational</tspan><tspan x="92" y="220.5">Requirements</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="92" y="244">Child safety</tspan><tspan class="mv-told-line" x="92" y="259">analysis</tspan></text></g><g class="mv-node" data-node="A3" data-kind="blue"><rect class="mv-shape" x="28" y="328" width="128" height="102" rx="8"/><rect class="mv-stripe" x="29" y="336" width="4" height="86"/><text><tspan x="92" y="354.5">📋 Compliance</tspan><tspan x="92" y="370.5">Review</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="92" y="394">COPPA/GDPR</tspan><tspan class="mv-told-line" x="92" y="409">assessment</tspan></text></g><g class="mv-node" data-node="A4" data-kind="blue"><rect class="mv-shape" x="28" y="478" width="128" height="102" rx="8"/><rect class="mv-stripe" x="29" y="486" width="4" height="86"/><text><tspan x="92" y="504.5">⚠️ Threat</tspan><tspan x="92" y="520.5">Modeling</tspan></text><text class="mv-told"><tspan class="mv-told-line" x="92" y="544">Educational</tspan><tspan class="mv-told-line" x="92" y="559">platform risks</tspan></text></g></g>
</svg>
