<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 344 504" width="344" height="504" role="img" aria-label="flow-small.mmd">
<title>flow-small.mmd</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-blue:#b3cbc7;--mv-kf-blue:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-blue:#2b5560;--mv-kf-blue:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="blue"] .mv-shape{fill:var(--mv-kf-blue);stroke:var(--mv-k-blue)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-point{fill:var(--mv-edge);stroke:var(--mv-edge)}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="blue"] .mv-stripe{fill:var(--mv-k-blue)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="344" height="504" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge mv-main" data-edge="A1-A2" data-style="solid"><path class="mv-line" d="M172,104L172,145"/><polygon class="mv-head" points="172,152 176.5,143 167.5,143"/></g><g class="mv-edge mv-main" data-edge="A2-A3" data-style="solid"><path class="mv-line" d="M172,228L172,269"/><polygon class="mv-head" points="172,276 176.5,267 167.5,267"/></g><g class="mv-edge mv-main" data-edge="A3-A4" data-style="solid"><path class="mv-line" d="M172,352L172,393"/><polygon class="mv-head" points="172,400 176.5,391 167.5,391"/></g></g><g></g><g><g class="mv-node" data-node="A1" data-kind="blue"><rect class="mv-shape" x="28" y="28" width="288" height="76" rx="8"/><rect class="mv-stripe" x="29" y="36" width="4" height="60"/><text><tspan x="172" y="54.5">🔍 AI Security Scan</tspan><tspan x="172" y="70.5">&lt;small&gt;Automated codebase</tspan><tspan x="172" y="86.5">review&lt;/small&gt;</tspan></text></g><g class="mv-node" data-node="A2" data-kind="blue"><rect class="mv-shape" x="28" y="152" width="288" height="76" rx="8"/><rect class="mv-stripe" x="29" y="160" width="4" height="60"/><text><tspan x="172" y="186.5">📚 Educational Requirements</tspan><tspan x="172" y="202.5">&lt;small&gt;Child safety analysis&lt;/small&gt;</tspan></text></g><g class="mv-node" data-node="A3" data-kind="blue"><rect class="mv-shape" x="28" y="276" width="288" height="76" rx="8"/><rect class="mv-stripe" x="29" y="284" width="4" height="60"/><text><tspan x="172" y="310.5">📋 Compliance Review</tspan><tspan x="172" y="326.5">&lt;small&gt;COPPA/GDPR assessment&lt;/small&gt;</tspan></text></g><g class="mv-node" data-node="A4" data-kind="blue"><rect class="mv-shape" x="28" y="400" width="288" height="76" rx="8"/><rect class="mv-stripe" x="29" y="408" width="4" height="60"/><text><tspan x="172" y="426.5">⚠️ Threat Modeling</tspan><tspan x="172" y="442.5">&lt;small&gt;Educational platform</tspan><tspan x="172" y="458.5">risks&lt;/small&gt;</tspan></text></g></g>
</svg>
