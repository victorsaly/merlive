<svg xmlns="http://www.w3.org/2000/svg" class="mv-svg" viewBox="0 0 184 872" width="184" height="872" role="img" aria-label="flow-notes.mmd">
<title>flow-notes.mmd</title>
<style>.mv-svg{--mv-bg:#eff6f5;--mv-node:#ffffff;--mv-stroke:#b3cbc7;--mv-text:#0f2f2d;--mv-muted:#48615e;--mv-edge:#5e827e;--mv-accent:#d6452b;--mv-k-blue:#b3cbc7;--mv-kf-blue:#ffffff;--mv-k-step:#b3cbc7;--mv-kf-step:#ffffff;--mv-k-orange:#b3cbc7;--mv-kf-orange:#ffffff;--mv-k-green:#b3cbc7;--mv-kf-green:#ffffff;--mv-dot:#d4dedd;--mv-group:#e7efee;--mv-shadow:#0f2f2d29}@media (prefers-color-scheme:dark){.mv-svg{--mv-bg:#06191d;--mv-node:#0d2a30;--mv-stroke:#2b5560;--mv-text:#e4f3f0;--mv-muted:#9bbcb7;--mv-edge:#6b9aa1;--mv-accent:#ff8566;--mv-k-blue:#2b5560;--mv-kf-blue:#0d2a30;--mv-k-step:#2b5560;--mv-kf-step:#0d2a30;--mv-k-orange:#2b5560;--mv-kf-orange:#0d2a30;--mv-k-green:#2b5560;--mv-kf-green:#0d2a30;--mv-dot:#213336;--mv-group:#0e2124;--mv-shadow:#00000080;color-scheme:dark}}
.mv-svg{font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif}
.mv-shape{fill:var(--mv-node);stroke:var(--mv-stroke);stroke-width:1.5}
.mv-node{filter:drop-shadow(0 2px 5px var(--mv-shadow))}
[data-kind="blue"] .mv-shape{fill:var(--mv-kf-blue);stroke:var(--mv-k-blue)}
[data-kind="step"] .mv-shape{fill:var(--mv-kf-step);stroke:var(--mv-k-step)}
[data-kind="orange"] .mv-shape{fill:var(--mv-kf-orange);stroke:var(--mv-k-orange)}
[data-kind="green"] .mv-shape{fill:var(--mv-kf-green);stroke:var(--mv-k-green)}
.mv-node .mv-detail{fill:none}
[data-outline~="dashed"] .mv-shape{stroke-dasharray:5 4}
[data-outline~="heavy"] .mv-shape{stroke-width:2.6}
.mv-node .mv-rows{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;text-anchor:start;white-space:pre}
.mv-node .mv-cell{font-size:12px;font-weight:400;text-anchor:start}
.mv-band{fill:var(--mv-text);opacity:0.06;stroke:none}
.mv-grid{fill:none;stroke:var(--mv-stroke);stroke-width:1}
.mv-node .mv-told{font-size:11.5px;font-weight:400}
.mv-node .mv-over{font-size:11px;font-weight:400;fill:var(--mv-muted)}
.mv-hollow{fill:var(--mv-bg);stroke:var(--mv-edge);stroke-width:1.4;stroke-linejoin:round}
.mv-icon{fill:none;stroke:var(--mv-text);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mv-node text{font-size:13px;font-weight:500;fill:var(--mv-text);text-anchor:middle}
.mv-line{fill:none;stroke:var(--mv-edge);stroke-width:1.4}
.mv-main .mv-line{stroke-width:2.4}
.mv-stripe{stroke:none}
.mv-node .mv-point{fill:var(--mv-edge);stroke:var(--mv-edge)}
.mv-node .mv-strong{font-weight:700}
.mv-node .mv-em{font-style:italic}
.mv-title{font-size:15px;font-weight:600;fill:var(--mv-text);text-anchor:middle}
[data-kind="blue"] .mv-stripe{fill:var(--mv-k-blue)}
[data-kind="step"] .mv-stripe{fill:var(--mv-k-step)}
[data-kind="orange"] .mv-stripe{fill:var(--mv-k-orange)}
[data-kind="green"] .mv-stripe{fill:var(--mv-k-green)}
[data-style="dotted"] .mv-line{stroke-dasharray:2 5;stroke-linecap:round}
[data-style="thick"] .mv-line{stroke-width:2.8}
.mv-head{fill:var(--mv-edge)}
.mv-cross{fill:none;stroke:var(--mv-edge);stroke-width:1.8;stroke-linecap:round}
.mv-label{font-size:11px;font-weight:600;fill:var(--mv-muted);text-anchor:middle;paint-order:stroke;stroke:var(--mv-bg);stroke-width:4px;stroke-linejoin:round}
.mv-group rect{fill:var(--mv-group);stroke:var(--mv-stroke);stroke-width:1;stroke-dasharray:5 4}
.mv-name{font-size:11px;font-weight:600;fill:var(--mv-muted);letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;paint-order:stroke;stroke:var(--mv-group);stroke-width:4px;stroke-linejoin:round}</style>
<rect width="100%" height="100%" fill="var(--mv-bg)"/>
<defs><pattern id="mv-dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="1" fill="var(--mv-dot)"/></pattern></defs><rect class="mv-ground" width="184" height="872" fill="url(#mv-dots)"/><g></g><g><g class="mv-edge mv-main" data-edge="A-B" data-style="solid"><path class="mv-line" d="M92,88L92,129"/><polygon class="mv-head" points="92,136 96.5,127 87.5,127"/></g><g class="mv-edge mv-main" data-edge="B-C" data-style="solid"><path class="mv-line" d="M92,196L92,237"/><polygon class="mv-head" points="92,244 96.5,235 87.5,235"/></g><g class="mv-edge mv-main" data-edge="C-D" data-style="solid"><path class="mv-line" d="M92,304L92,345"/><polygon class="mv-head" points="92,352 96.5,343 87.5,343"/></g><g class="mv-edge mv-main" data-edge="D-E" data-style="solid"><path class="mv-line" d="M92,412L92,453"/><polygon class="mv-head" points="92,460 96.5,451 87.5,451"/></g><g class="mv-edge mv-main" data-edge="E-F" data-style="solid"><path class="mv-line" d="M92,520L92,561"/><polygon class="mv-head" points="92,568 96.5,559 87.5,559"/></g><g class="mv-edge mv-main" data-edge="F-G" data-style="solid"><path class="mv-line" d="M92,628L92,669"/><polygon class="mv-head" points="92,676 96.5,667 87.5,667"/></g><g class="mv-edge mv-main" data-edge="G-H" data-style="solid"><path class="mv-line" d="M92,736L92,777"/><polygon class="mv-head" points="92,784 96.5,775 87.5,775"/></g></g><g></g><g><g class="mv-node" data-node="A" data-kind="blue"><rect class="mv-shape" x="28" y="28" width="128" height="60" rx="8"/><rect class="mv-stripe" x="29" y="36" width="4" height="44"/><text><tspan x="92" y="54.5">Command</tspan><tspan x="92" y="70.5">Executed</tspan></text></g><g class="mv-node" data-node="B" data-kind="step"><rect class="mv-shape" x="28" y="136" width="128" height="60" rx="8"/><text><tspan x="92" y="170.5">Find Blog Post</tspan></text></g><g class="mv-node" data-node="C" data-kind="step"><rect class="mv-shape" x="28" y="244" width="128" height="60" rx="8"/><text><tspan x="92" y="270.5">Extract</tspan><tspan x="92" y="286.5">Metadata</tspan></text></g><g class="mv-node" data-node="D" data-kind="step"><rect class="mv-shape" x="28" y="352" width="128" height="60" rx="8"/><text><tspan x="92" y="378.5">Generate AI</tspan><tspan x="92" y="394.5">Prompt</tspan></text></g><g class="mv-node" data-node="E" data-kind="orange"><rect class="mv-shape" x="28" y="460" width="128" height="60" rx="8"/><rect class="mv-stripe" x="29" y="468" width="4" height="44"/><text><tspan x="92" y="494.5">Call DALL-E 3</tspan></text></g><g class="mv-node" data-node="F" data-kind="step"><rect class="mv-shape" x="28" y="568" width="128" height="60" rx="8"/><text><tspan x="92" y="602.5">Download Image</tspan></text></g><g class="mv-node" data-node="G" data-kind="step"><rect class="mv-shape" x="28" y="676" width="128" height="60" rx="8"/><text><tspan x="92" y="702.5">Update Blog</tspan><tspan x="92" y="718.5">Post</tspan></text></g><g class="mv-node" data-node="H" data-kind="green"><rect class="mv-shape" x="28" y="784" width="128" height="60" rx="8"/><rect class="mv-stripe" x="29" y="792" width="4" height="44"/><text><tspan x="92" y="810.5">Ready to</tspan><tspan x="92" y="826.5">Publish</tspan></text></g></g>
</svg>
